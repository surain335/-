        function getSenseKey(wenZhongYi) {
            const s = wenZhongYi.trim();
            const standardizedSenseKeys = {
                '动词，溺水、淹没': '动词，溺水、淹没',
                '拿着、握着': '拿着、握着',
                '您，对对方的尊称': '您，对对方的尊称',
                '主语省略，省略“曰”之前的主语': '主语省略，省略“曰”之前的主语',
                '副词，翻译为“也”': '副词，翻译为“也”',
                '代词，代指前文提到的人或事物': '代词，代指前文提到的人或事物',
                '为什么、怎么，表疑问': '为什么、怎么，表疑问',
                '连词表修饰，前词表方式状态，后词表动作': '连词表修饰，前词表方式状态，后词表动作',
                '介词，在、从；古句式：动词+于+宾语': '介词，在、从；古句式：动词+于+宾语',
                '介词，引出动作对象，译为“在、被、向、对于、对”': '介词，引出动作对象，译为“在、被、向、对于、对”',
                '并列连词，和、同': '并列连词，和、同',
                '无定代词，有的（人）': '无定代词，有的（人）',
                '让步连词，虽然、即使': '让步连词，虽然、即使',
                '状语后置，介词结构（于 + 宾语）后置于动词': '状语后置，介词结构（于 + 宾语）后置于动词',
                '第三人称物主代词，他的、它的、他们的': '第三人称物主代词，他的、它的、他们的',
                '指示代词，意为那、那个、那些': '指示代词，意为那、那个、那些',
                '连词，来、用来，表目的关系': '连词，来、用来，表目的关系',
                '介词，引进工具，译为“用”': '介词，引进工具，译为“用”',
                '介词，凭借、依据': '介词，凭借、依据',
                '介词，把、拿': '介词，把、拿',
                '所以、因此，表因果': '所以、因此，表因果',
                '所以、因此': '所以、因此，表因果'
            };
            if (standardizedSenseKeys[s]) return standardizedSenseKeys[s];
            if (/形容词：对的、正确的/.test(s)) return '形容词：对的、正确的';
            if (/假设让步/.test(s) && /虽/.test(s)) return '假设让步，\u201c即使……，一定……\u201d';
            if (/事实让步|基于事实/.test(s) && /虽/.test(s)) return '事实让步，\u201c虽然......必定......\u201d';
            if (/表承接|然后|就/.test(s) && /连词/.test(s)) return '连词，表承接（然后、就）';
            if (/表转折|但是|却/.test(s) && /连词/.test(s)) return '连词，表转折（但是、却）';
            if (/表修饰|修饰/.test(s) && /连词/.test(s)) return '连词，表修饰（连接状语和动词，不译）';
            if (/连词.*转折/.test(s)) return '连词，表转折（但是、却）';
            if (/连词.*承接/.test(s)) return '连词，表承接（然后、就）';
            if (/结构助词|助词.*的/.test(s) && !/取独|取消|定语后置|音节/.test(s)) return '结构助词，相当于现代汉语"的"';
            if (/取独|取消.*独立/.test(s)) return '用在主谓之间，取消句子独立性，不翻译';
            if (/定语后置|后置.*标志/.test(s)) return '定语后置的标志，无实义，是古汉语特有语法标记';
            if (/音节助词|凑.*音节|补足音节/.test(s)) return '音节助词，凑足音节，不翻译';
            if (/动词.*到|动词.*往|动词.*去|动词.*前往/.test(s)) return '动词，到、前往某个地方';
            if (/代词.*指代|指代.*前文|代词.*它|代词.*他/.test(s) && !/指示/.test(s)) return '代词，指代前文提到的人或事物（他/她/它/这件事）';
            if (/的人|的事物|指代.*结构|者.*指/.test(s) || s.includes('……的人')) return '代词，……的人/事物';
            if (/指示代词|这|此(?!.*对)/.test(s) && !/判断|正确/.test(s)) return '指示代词，这、此';
            if (/判断.*动词|正确|对(?!.*面)/.test(s) && /是/.test(s)) return '判断动词，是（对/正确）';
            if (/在|从(?!.*对)|状语后置/.test(s) && /介词/.test(s) && !/对于|向|面/.test(s))
                return '介词，在/从/到（常与状语后置句式关联）';
            if (/对于|向|面对|面/.test(s) && /介词/.test(s)) return '介词，对于/向/面对（引出动作的对象）';
            if (/兼词|于此|于之|在那里|在这里/.test(s)) return '兼词，相当于"于此"（在那里/在这件事上）';
            if (/语气.*助词|句末|语气词/.test(s)) return '语气助词，用在句末，表示陈述或反问语气';
            if (/代词|哪里|怎么/.test(s) && !/兼/.test(s)) return '代词/疑问代词，哪里、怎么';
            if (/语气|句末|了/.test(s)) return '语气助词，表示"了"，用在句末表确认或感叹';
            if (/代词.*他|代词.*它|代词.*那/.test(s)) return '代词，他的/它的/那个';
            if (/反问|难道/.test(s)) return '语气副词，表反问（难道）';
            if (/推测|大概|也许/.test(s)) return '语气副词，表推测（大概、也许）';
            const parts = s.split(/[，,、；;]/);
            return parts[0].trim();
        }


        // 仅对跨课关联展示内容做定向修正，不改动节点自身状态栏数据
        function sanitizeCrossSentence(label, sense, sentence) {
            let s = (sentence || '').trim();
            if (label === '之' && /结构助词/.test(sense || '')) {
                s = s.split(/[／/]/).map(part => part.trim()).filter(part => part && part !== '发鸠之山').join('／');
            }
            return s;
        }

        function sanitizeCrossSenseTitle(label, title) {
            if (label === '也') {
                return '句末语气助词，分三类：1.表判断；2.表感叹肯定；3.表反问。可不译或译为“啊”“呢”';
            }
            if (label === '焉' && /句末语气助词|语气助词/.test(title || '') && !/兼词/.test(title || '')) {
                return '句末语气助词，可译作也可直接不译。';
            }
            return title;
        }

        // 统一生成跨课关联讲解数据；状态栏和讲解弹窗必须共同调用本函数
        function buildCrossSenseGroups(label) {
            const ids = labelMap[label] || [];
            const senseMap = new Map();
            const senseOrder = [];

            ids.forEach(id => {
                const node = rawNodes.find(n => n.id === id);
                if (!node || node.isTextCenter || node.isBlock) return;
                if (!currentFilters.has('all') && currentFilters.size > 0) {
                    if (!currentFilters.has(node.text)) return;
                }

                const lesson = node.text || '未知篇目';
                (node.entries || []).forEach(entry => {
                    const sense = (entry.wenZhongYi || '').trim();
                    if (!sense) return;
                    const key = getSenseKey(sense);
                    if (!senseMap.has(key)) {
                        senseMap.set(key, { title: sense, items: [] });
                        senseOrder.push(key);
                    }
                    if (entry.sentence && entry.sentence.trim()) {
                        const crossSentence = sanitizeCrossSentence(label, sense, entry.sentence);
                        if (!crossSentence) return;
                        senseMap.get(key).items.push({
                            lesson,
                            sentence: crossSentence,
                            entryLabel: entry.entryLabel || label,
                            originalSense: sense
                        });
                    }
                });
            });

            const groups = senseOrder.map(key => senseMap.get(key));
            groups.forEach(group => { group.title = sanitizeCrossSenseTitle(label, group.title); });
            return groups;
        }

        // 状态栏专用：忽略当前篇目筛选，只累计显示当前篇目及其以前篇目的例句
        function buildStatusCrossSenseGroups(label, currentLesson) {
            const ids = labelMap[label] || [];
            const senseMap = new Map();
            const senseOrder = [];
            const currentLessonIndex = allLessonNames.indexOf(currentLesson);

            ids.forEach(id => {
                const relatedNode = rawNodes.find(n => n.id === id);
                if (!relatedNode || relatedNode.isTextCenter || relatedNode.isBlock) return;

                const relatedLessonIndex = allLessonNames.indexOf(relatedNode.text);
                if (currentLessonIndex >= 0 && (relatedLessonIndex < 0 || relatedLessonIndex > currentLessonIndex)) return;

                const lesson = relatedNode.text || '未知篇目';
                (relatedNode.entries || []).forEach(entry => {
                    const sense = (entry.wenZhongYi || '').trim();
                    if (!sense) return;
                    const key = getSenseKey(sense);
                    if (!senseMap.has(key)) {
                        senseMap.set(key, { title: sense, items: [] });
                        senseOrder.push(key);
                    }
                    if (entry.sentence && entry.sentence.trim()) {
                        const crossSentence = sanitizeCrossSentence(label, sense, entry.sentence);
                        if (!crossSentence) return;
                        senseMap.get(key).items.push({
                            lesson,
                            sentence: crossSentence,
                            entryLabel: entry.entryLabel || label,
                            originalSense: sense
                        });
                    }
                });
            });

            const groups = senseOrder.map(key => senseMap.get(key));
            groups.forEach(group => { group.title = sanitizeCrossSenseTitle(label, group.title); });
            return groups;
        }

        // 构建讲解视图（针对文化节点特殊处理）
        function buildLectureView(label) {

            );
            // 排序：精确匹配 > 前缀匹配 > 其他
            results.sort((a, b) => {
                const aLabel = a.raw.label;
                const bLabel = b.raw.label;
                const aBase = a.raw.baseLabel || aLabel;
                const bBase = b.raw.baseLabel || bLabel;
                // 精确匹配（label或baseLabel完全等于查询词）
                const aExact = (aLabel === query || aBase === query);
                const bExact = (bLabel === query || bBase === query);
                if (aExact && !bExact) return -1;
                if (!aExact && bExact) return 1;
                // 前缀匹配
                const aPrefix = aLabel.startsWith(query) || aBase.startsWith(query);
                const bPrefix = bLabel.startsWith(query) || bBase.startsWith(query);
                if (aPrefix && !bPrefix) return -1;
                if (!aPrefix && bPrefix) return 1;
                return 0;

        function updateActiveTime(now) {

            // 防止电脑休眠或浏览器冻结后一次性累计数小时。
            const delta = Math.max(0, Math.min(current - _lastTickAt, 2000));
            if (document.visibilityState === 'visible' && current - _lastActivityAt <= IDLE_LIMIT_MS) {
                _activeMs += delta;
            }
            _lastTickAt = current;
        }

        function splitMultiValue(value) {
            return String(value || '')
                .split(/[；;、]/)
                .map(function(v) { return v.trim().replace(/・/g, '·'); })
                .filter(Boolean);
        }

        function getNodeRelations(node) {
            const values = [];
            function add(value) {
                splitMultiValue(value).forEach(function(v) {
                    if (!values.includes(v)) values.push(v);
                });
            }
            add(node && node.relationFull);
            (node && node.entries || []).forEach(function(entry) {
                add(entry.relationFull);
                add(entry.relation);
            });
            return values;
        }

        function getNodeStatuses(node) {
            const values = [];
            function add(value) {
                if (value && !values.includes(value)) values.push(value);
            }
            add(node && node.status);
            (node && node.entries || []).forEach(function(entry) { add(entry.status); });
            return values;
        }

        function relationMatches(relations, target) {
            return relations.some(function(rel) {
                return rel === target || rel.startsWith(target + '·') || target.startsWith(rel + '·');
            });
        }

        function getKnowledgeLabel(node) {
            if (!node) return '';
            return String(node.baseLabel || node.label || '').trim();
        }

        function getKnowledgeKey(node) {
            if (!node) return '';
            const label = getKnowledgeLabel(node);
            const category = String(node.category || '').trim();
            if (!label || !category) return '';
            return label + '||' + category;
        }

        function getKnowledgeDisplay(node) {
            const label = getKnowledgeLabel(node);
            const category = String(node && node.category || '').trim();
            return category ? label + '（' + category + '）' : label;
        }

        function isCrossKnowledgeNode(node) {
            if (!node) return false;
            const base = getKnowledgeLabel(node);
            const ids = labelMap[base] || [];
            const lessons = new Set();
            ids.forEach(function(id) {
                const related = rawNodes.find(function(n) { return n.id === id; });
                if (related && !related.isTextCenter && !related.isBlock) lessons.add(related.text);
            });
            return lessons.size >= 2;
        }

        function getMatchedSelectedStatuses(nodes) {
            const active = Array.from(currentHighlights);
            const matched = [];
            STATUS_ORDER.forEach(function(status) {
                if (!active.includes('status-' + status)) return;
                const hasMatch = nodes.some(function(node) { return getNodeStatuses(node).includes(status); });
                if (hasMatch) matched.push(status);
            });
            return matched;
        }

        function getMatchedSelectedRelationGroups(nodes) {
            const active = Array.from(currentHighlights);
            const matched = [];
            const allRelations = [];
            nodes.forEach(function(node) {
                getNodeRelations(node).forEach(function(rel) {
                    if (!allRelations.includes(rel)) allRelations.push(rel);
                });
            });

            const semanticSelected = ['语义扩大', '语义缩小', '语义转移'].some(function(name) {
                return active.includes('rel-' + name) && relationMatches(allRelations, name);
            });
            if (semanticSelected) matched.push('语义层');

            ['通假字', '古今字', '多音多义', '异词同形'].forEach(function(name) {
                if (active.includes('rel-' + name) && relationMatches(allRelations, name)) matched.push(name);
            });

            const wordClassSelected = active.some(function(value) {
                if (!value.startsWith('rel-词类活用')) return false;
                const target = value.replace('rel-', '');
                return allRelations.some(function(rel) {
                    return relationMatches([rel], target) || rel.startsWith('词类活用');
                });
            });
            if (wordClassSelected) matched.push('词类活用');

            const sentenceSelected = ['省略句', '判断句', '让步句式', '被动句', '倒装句'].some(function(name) {
                return active.includes('rel-' + name) && relationMatches(allRelations, name);
            });
            if (sentenceSelected) matched.push('句式');

            return Array.from(new Set(matched));
        }

        function selectedFilterContext(nodes, source, isCrossEvent) {
            const parts = [];
            const active = Array.from(currentHighlights);
            const primary = nodes[0];

            const activeCats = active
                .filter(function(value) { return value.startsWith('cat-'); })
                .map(function(value) { return value.replace('cat-', ''); })
                .filter(function(cat) { return nodes.some(function(node) { return node.category === cat; }); });
            if (activeCats.length) parts.push('分类-' + activeCats.join('/'));

            if (isCrossEvent) parts.push('跨课关联');
            getMatchedSelectedRelationGroups(nodes).forEach(function(group) { parts.push('关联-' + group); });
            getMatchedSelectedStatuses(nodes).forEach(function(status) { parts.push('现状-' + status); });

            if (primary && !currentFilters.has('all') && currentFilters.has(primary.text)) {
                parts.push('篇目-' + primary.text);
            }
            if (source === '搜索') parts.push('搜索');
            else if (source === '目录') parts.push('目录');
            else if (source === '跨课关联讲解') parts.push('跨课关联讲解');
            if (parts.length === 0) parts.push('自由浏览');
            return Array.from(new Set(parts)).join('+');
        }

        function addKnowledgeToUniqueSets(node, options) {
            const key = getKnowledgeKey(node);
            if (!key) return;
            const config = options || {};

            _allUnique.add(key);
            if (_categoryUnique[node.category]) _categoryUnique[node.category].add(key);

            (config.statuses || []).forEach(function(status) {
                if (_statusUnique[status]) _statusUnique[status].add(key);
            });
            (config.relations || []).forEach(function(group) {
                if (_relationUnique[group]) _relationUnique[group].add(key);
            });
            if (config.isCross) _crossUnique.add(key);
            if (config.isCrossLecture) _crossLectureUnique.add(key);
            if (config.isSearch) _searchUnique.add(key);

            (config.lessons || []).forEach(function(lesson) {
                if (_lessonUnique[lesson]) _lessonUnique[lesson].add(key);
            });
        }

        function pushClickEvent(node, options) {
            const config = options || {};
            const key = getKnowledgeKey(node);
            if (!key) return;
            _clickEvents.push({
                key: key,
                display: getKnowledgeDisplay(node),
                label: getKnowledgeLabel(node),
                category: node.category || '',
                lessons: (config.lessons || []).slice(),
                source: config.source || '图谱',
                statuses: (config.statuses || []).slice(),
                relations: (config.relations || []).slice(),
                isCross: !!config.isCross,
                isCrossLecture: !!config.isCrossLecture,
                context: selectedFilterContext(config.contextNodes || [node], config.source || '图谱', !!config.isCross),
                at: Date.now()
            });
        }

        // 点击真实知识节点：
        // 1. 总数和五大分类按“独立知识点”去重；
        // 2. 现状、关联类型、跨课关联仅在对应筛选状态下计入；
        // 3. 点击事件仍完整保留，用于各类TOP10。
        function trackNodeClick(node, source) {
            if (!_sessionStart || !node || node.isTextCenter || node.isBlock) return;
            markActivity();

            const nodesForContext = [node];
            const statuses = getMatchedSelectedStatuses(nodesForContext);
            const relations = getMatchedSelectedRelationGroups(nodesForContext);
            const isCross = currentHighlights.has('cross') && isCrossKnowledgeNode(node);
            const isSearch = source === '搜索';
            const lessons = node.text ? [node.text] : [];

            addKnowledgeToUniqueSets(node, {
                statuses: statuses,
                relations: relations,
                isCross: isCross,
                isCrossLecture: false,
                isSearch: isSearch,
                lessons: lessons
            });

            pushClickEvent(node, {
                source: source || '图谱',
                statuses: statuses,
                relations: relations,
                isCross: isCross,
                isCrossLecture: false,
                lessons: lessons,
                contextNodes: nodesForContext
            });
        }

        // 取得红色跨课连线对应的全部知识节点。用于继承当前组合筛选，并把同一知识点计入相关篇目。
        function resolveCrossLectureNodes(label, edge) {
            const found = [];
            const seen = new Set();
            function addNode(node) {
                if (!node || node.isTextCenter || node.isBlock || seen.has(node.id)) return;
                if (getKnowledgeLabel(node) !== label) return;
                seen.add(node.id);
                found.push(node);
            }

            if (edge) {
                [edge.source, edge.target].forEach(function(id) {
                    addNode(rawNodes.find(function(item) { return item.id === id; }));
                });
            }
            (labelMap[label] || []).forEach(function(id) {
                addNode(rawNodes.find(function(item) { return item.id === id; }));
            });
            return found;
        }

        // 点击红色跨课连线：视为一次知识点学习。
        // 它同时计入总独立知识点、基础分类、跨课关联、跨课讲解，
        // 并继承点击当时已经选择且与该知识点匹配的现状和关联类型筛选。
        function trackCrossModal(label, edge) {
            if (!_sessionStart || !label) return;
            markActivity();

            const relatedNodes = resolveCrossLectureNodes(label, edge);
            const node = relatedNodes[0];
            if (!node) return;

            const statuses = getMatchedSelectedStatuses(relatedNodes);
            const relations = getMatchedSelectedRelationGroups(relatedNodes);
            const lessons = Array.from(new Set(relatedNodes.map(function(item) { return item.text; }).filter(Boolean)));

            addKnowledgeToUniqueSets(node, {
                statuses: statuses,
                relations: relations,
                isCross: true,
                isCrossLecture: true,
                isSearch: false,
                lessons: lessons
            });

            pushClickEvent(node, {
                source: '跨课关联讲解',
                statuses: statuses,
                relations: relations,
                isCross: true,
                isCrossLecture: true,
                lessons: lessons,
                contextNodes: relatedNodes
            });
        }

        // 搜索点击次数按“点击一条搜索结果并成功打开知识点”计算。
        // 搜索打开的独立知识点由 trackNodeClick(source='搜索') 自动去重记录。
        function trackSearch() {
            if (!_sessionStart) return;
            markActivity();
            _searchClickCount++;
        }

        // 切换篇目筛选本身不算学习知识点，只作为交互活动维持有效学习计时。
        function trackLesson(lessonName) {
            if (!_sessionStart || !lessonName || lessonName === 'all') return;
            markActivity();
        }

        function countMap(items, keyFn) {
            const map = new Map();
            items.forEach(function(item) {
                const key = keyFn(item);
                if (!key) return;
                map.set(key, (map.get(key) || 0) + 1);
            });
            return map;
        }

        function sortedTop(map, limit) {
            return Array.from(map.entries())
                .sort(function(a, b) {
                    if (b[1] !== a[1]) return b[1] - a[1];
                    return String(a[0]).localeCompare(String(b[0]), 'zh-CN');
                })
                .slice(0, limit || 10);
        }

        function formatTop(entries) {
            if (!entries.length) return '无';
            return entries.map(function(item) { return item[0] + '×' + item[1]; }).join('；');
        }

        function formatUniqueDistribution(order, setMap) {
            const indexed = new Map(order.map(function(name, index) { return [name, index]; }));
            const items = order
                .map(function(name) { return [name, setMap[name] ? setMap[name].size : 0]; })
                .filter(function(item) { return item[1] > 0; })
                .sort(function(a, b) {
                    if (b[1] !== a[1]) return b[1] - a[1];
                    return indexed.get(a[0]) - indexed.get(b[0]);
                });
            return items.length ? items.map(function(item) { return item[0] + '×' + item[1]; }).join('；') : '无';
        }

        function buildOverallTop10() {
            return formatTop(sortedTop(countMap(_clickEvents, function(event) { return event.display; }), 10));
        }

        function buildStatusTop10() {
            const events = _clickEvents.filter(function(event) { return event.statuses.length > 0; });
            return formatTop(sortedTop(countMap(events, function(event) { return event.display; }), 10));
        }

        function buildCrossTop10() {
            const events = _clickEvents.filter(function(event) { return event.isCross; });
            return formatTop(sortedTop(countMap(events, function(event) { return event.display; }), 10));
        }

        function buildCrossLectureTop10() {
            const events = _clickEvents.filter(function(event) { return event.isCrossLecture; });
            return formatTop(sortedTop(countMap(events, function(event) { return event.display; }), 10));
        }

        function buildLessonDistribution() {
            return formatUniqueDistribution(allLessonNames, _lessonUnique);
        }

        function getEffectiveMinutes() {
            updateActiveTime();
            if (!_sessionStart) return 0;
            return Math.max(1, Math.ceil(_activeMs / 60000));
        }

        function buildRecord() {
            return {
                classname: _userClass,
                name: _userName,
                id: _userId,
                duration: getEffectiveMinutes(),
                totalUnique: _allUnique.size,
                categoryDistribution: formatUniqueDistribution(CATEGORY_ORDER, _categoryUnique),
                statusDistribution: formatUniqueDistribution(STATUS_ORDER, _statusUnique),
                relationDistribution: formatUniqueDistribution(RELATION_ORDER, _relationUnique),
                crossUnique: _crossUnique.size,
                crossLectureUnique: _crossLectureUnique.size,
                lessonDistribution: buildLessonDistribution(),
                overallTop10: buildOverallTop10(),
                statusTop10: buildStatusTop10(),
                crossTop10: buildCrossTop10(),
                crossLectureTop10: buildCrossLectureTop10(),
                searchUnique: _searchUnique.size,
                searchClickCount: _searchClickCount
            };
        }

        function buildParams(record) {
            const params = new URLSearchParams();
            Object.keys(ENTRY).forEach(function(key) {
                params.append(ENTRY[key], record[key] === undefined || record[key] === null ? '' : String(record[key]));
            });
            Object.keys(FORM_EXTRA_FIELDS).forEach(function(key) {
                params.append(key, FORM_EXTRA_FIELDS[key]);
            });
            return params;
        }

        // 使用浏览器原生HTML表单提交到隐藏iframe，一次只形成一条正式答卷。
        function submitViaHiddenForm(record) {
            return new Promise(function(resolve, reject) {
                const iframe = document.createElement('iframe');
                const frameName = 'google_form_target_' + Date.now() + '_' + Math.random().toString(36).slice(2);
                iframe.name = frameName;
                iframe.style.display = 'none';
                iframe.setAttribute('aria-hidden', 'true');

                const form = document.createElement('form');
                form.method = 'POST';
                form.action = FORM_BASE;
                form.target = frameName;
                form.acceptCharset = 'UTF-8';
                form.style.display = 'none';

                buildParams(record).forEach(function(value, key) {
                    const input = document.createElement('input');
                    input.type = 'hidden';
                    input.name = key;
                    input.value = value;
                    form.appendChild(input);
                });

                let finished = false;
                let timer = null;
                function cleanup() {
                    if (timer) clearTimeout(timer);
                    setTimeout(function() {
                        if (form.parentNode) form.parentNode.removeChild(form);
                        if (iframe.parentNode) iframe.parentNode.removeChild(iframe);
                    }, 500);
                }
                function finish(ok, error) {
                    if (finished) return;
                    finished = true;
                    cleanup();
                    if (ok) resolve();
                    else reject(error || new Error('Google 表单提交失败'));
                }

                iframe.addEventListener('load', function() {
                    if (form.dataset.submitted === '1') finish(true);
                });
                iframe.addEventListener('error', function() {
                    finish(false, new Error('Google 表单响应加载失败'));
                });

                document.body.appendChild(iframe);
                document.body.appendChild(form);
                form.dataset.submitted = '1';

                try {
                    form.submit();
                    // 少数浏览器会阻止跨域iframe读取完成状态，请求发出后以超时作为完成兜底。
                    timer = setTimeout(function() { finish(true); }, 6000);
                } catch (error) {
                    finish(false, error);
                }
            });
        }

        function escapeHtml(value) {
            return String(value === undefined || value === null ? '' : value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function reportField(label, value) {
            return '<div class="test-report-field">'
                + '<span class="field-name">' + escapeHtml(label) + '</span>'
                + '<span class="field-value">' + escapeHtml(value) + '</span>'
                + '</div>';
        }

        function reportLongField(label, value) {
            return '<div class="test-report-long">'
                + '<span class="field-name">' + escapeHtml(label) + '</span>'
                + '<div class="field-value">' + escapeHtml(value) + '</div>'
                + '</div>';
        }

        // 本地测试报告严格按照新Google表单17项顺序展示，但不会发出任何提交请求。
        function buildTestDisplay(record) {
            return ''
                + '<div class="test-report-note">🧪 当前为本地测试模式：以下17项仅供逐项核对，绝不会写入 Google 表单。</div>'
                + '<div class="test-report-section"><h3>一、学生信息与总体情况（1—5）</h3><div class="test-report-grid">'
                + reportField('1. 班级', record.classname)
                + reportField('2. 姓名', record.name)
                + reportField('3. 学号', record.id)
                + reportField('4. 有效学习时间（分钟）', record.duration)
                + reportField('5. 本次学习的独立知识点总数', record.totalUnique)
                + '</div></div>'
                + '<div class="test-report-section"><h3>二、独立知识点分布（6—11）</h3>'
                + reportLongField('6. 分类学习分布（独立知识点数）', record.categoryDistribution)
                + reportLongField('7. 文中功能现状学习分布（独立知识点数）', record.statusDistribution)
                + reportLongField('8. 关联类型学习分布（独立知识点数）', record.relationDistribution)
                + '<div class="test-report-grid">'
                + reportField('9. 跨课关联学习的独立知识点数', record.crossUnique)
                + reportField('10. 跨课关联讲解涉及的独立知识点数', record.crossLectureUnique)
                + '</div>'
                + reportLongField('11. 篇目学习分布（独立知识点数）', record.lessonDistribution)
                + '</div>'
                + '<div class="test-report-section"><h3>三、点击次数TOP10（12—15）</h3>'
                + reportLongField('12. 全部知识点点击次数TOP10', record.overallTop10)
                + reportLongField('13. 文中功能现状下点击次数TOP10', record.statusTop10)
                + reportLongField('14. 跨课关联下点击次数TOP10', record.crossTop10)
                + reportLongField('15. 跨课关联讲解点击次数TOP10', record.crossLectureTop10)
                + '</div>'
                + '<div class="test-report-section"><h3>四、搜索行为（16—17）</h3><div class="test-report-grid">'
                + reportField('16. 搜索打开的独立知识点数', record.searchUnique)
                + reportField('17. 搜索功能使用次数（点击次数）', record.searchClickCount)
                + '</div></div>';
        }

        async function submitData() {
            if (!_sessionStart || !_userName) return { ok: false, reason: 'not-logged-in' };
            const record = buildRecord();

            if (!IS_OFFICIAL_GITHUB) {
                console.group('🧪 知识图谱测试数据（未提交）');
                console.table(record);
                console.groupEnd();
                return { ok: true, test: true, record: record };
            }

            if (_submitted) return { ok: true, duplicate: true, record: record };
            _submitted = true;
            try {
                await submitViaHiddenForm(record);
                return { ok: true, test: false, record: record };
            } catch (error) {
                _submitted = false;
                console.error('学习记录提交失败：', error);
                return { ok: false, error: error, record: record };
            }
        }

        function buildStudentEndDisplay(record) {
            return ''
                + '<div class="student-end-message">'
                + '<div class="student-duration-card">本次有效学习时间<strong>' + escapeHtml(record.duration) + ' 分钟</strong></div>'
                + '</div>';
        }

        // 正式学生端只显示有效学习时长；本地测试端显示17项完整预览。
        function showEndOverlay() {
            if (!_sessionStart || !_userName) return;
            const record = buildRecord();
            const box = document.getElementById('endBox');
            const info = document.getElementById('endInfo');
            const title = document.getElementById('endTitle');
            const icon = document.getElementById('endIcon');
            const submitButton = document.getElementById('endSubmitBtn');
            const cancelButton = document.getElementById('endCancelBtn');

            cancelButton.style.display = 'block';
            if (IS_OFFICIAL_GITHUB) {
                box.classList.remove('test-report');
                icon.textContent = '📊';
                title.textContent = '结束学习';
                info.innerHTML = buildStudentEndDisplay(record);
                submitButton.textContent = '确认提交并退出';
                cancelButton.textContent = '继续学习';
            } else {
                box.classList.add('test-report');
                icon.textContent = '🧪';
                title.textContent = '本次测试数据预览';
                info.innerHTML = buildTestDisplay(record);
                submitButton.textContent = '结束本次测试（不提交）';
                cancelButton.textContent = '返回继续测试';
            }

            document.getElementById('endOverlay').classList.add('open');
            document.getElementById('endDone').style.display = 'none';
            submitButton.style.display = 'block';
            submitButton.disabled = false;
        }

        function closeEndOverlay() {
            document.getElementById('endOverlay').classList.remove('open');
        }

        function leaveLearningPage() {
            _allowUnload = true;
            try { window.close(); } catch (error) {}
            setTimeout(function() {
                if (!window.closed) window.location.replace('about:blank');
            }, 350);
        }

        // 正式网页提交一次后退出；本地测试只更新预览和控制台，不提交。
        async function doEndSubmit() {
            const button = document.getElementById('endSubmitBtn');
            const done = document.getElementById('endDone');
            button.disabled = true;
            button.textContent = IS_OFFICIAL_GITHUB ? '正在提交…' : '正在生成测试记录…';

            const result = await submitData();
            if (!result || !result.ok) {
                button.disabled = false;
                button.textContent = IS_OFFICIAL_GITHUB ? '提交失败，请重试' : '生成失败，请重试';
                return;
            }

            if (result.test) {
                document.getElementById('endInfo').innerHTML = buildTestDisplay(result.record);
                done.textContent = '🧪 测试数据已生成，未写入 Google 表单。';
                done.style.display = 'block';
                button.style.display = 'none';
                return;
            }

            button.style.display = 'none';
            document.getElementById('endCancelBtn').style.display = 'none';
            done.textContent = result.duplicate
                ? '✅ 本次学习记录已经提交，正在退出…'
                : '✅ 学习记录已提交，感谢你的学习！正在退出…';
            done.style.display = 'block';
            setTimeout(leaveLearningPage, 800);
        }

        // 浏览器原生离开确认：只有正式GitHub网页启用；测试环境不会触发表单提交。
        window.addEventListener('beforeunload', function(e) {
            if (!IS_OFFICIAL_GITHUB || !_sessionStart || !_userName || _submitted || _allowUnload) return;
            showEndOverlay();
            e.preventDefault();
            e.returnValue = '';
        });

        // 学生直接关闭正式网页时，使用 sendBeacon / keepalive 尝试提交一条正式记录。
        window.addEventListener('pagehide', function() {
            if (!IS_OFFICIAL_GITHUB || !_sessionStart || !_userName || _submitted || _allowUnload) return;
            const record = buildRecord();
            const payload = buildParams(record).toString();
            let queued = false;
            try {
                if (navigator.sendBeacon) {
                    const blob = new Blob([payload], {
                        type: 'application/x-www-form-urlencoded;charset=UTF-8'
                    });
                    queued = navigator.sendBeacon(FORM_BASE, blob);
                }
                if (!queued) {
                    fetch(FORM_BASE, {
                        method: 'POST',
                        mode: 'no-cors',
                        keepalive: true,
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
                        body: payload
                    }).catch(function() {});
                }
                _submitted = true;
            } catch (error) {
                try {
                    fetch(FORM_BASE, {
                        method: 'POST',
                        mode: 'no-cors',
                        keepalive: true,
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
                        body: payload
                    }).catch(function() {});
                    _submitted = true;
                } catch (ignore) {}
            }
        });

        console.log('📖 古代汉语知识图谱（全七课完整版）已加载');
        console.log(`共 ${nodes.length} 个节点，${edges.length} 条边`);
    </script>
</body>
