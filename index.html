                });
            });
            return map[lesson]?.[category] || '';
        }

        function getTextCenterId(lesson) {
            const map = {};
            textCenterNodes.forEach(n => { map[n.text] = n.id; });
            return map[lesson] || '';
        }

        rawNodes.forEach(node => {
            if (node.isTextCenter) return;
            if (node.isBlock) {
                const centerId = getTextCenterId(node.text);
                if (centerId) addEdge(centerId, node.id);
                return;
            }
            const blockId = getBlockId(node.text, node.category);
            if (blockId) addEdge(blockId, node.id);
        });

        // 跨课关联
        const labelMap = {};
        rawNodes.forEach(n => {
            if (n.isTextCenter || n.isBlock) return;
            const key = n.baseLabel || n.label;
            if (!labelMap[key]) labelMap[key] = [];
            labelMap[key].push(n.id);
        });
        const crossPairs = new Set();
        Object.keys(labelMap).forEach(baseLabel => {
            const ids = labelMap[baseLabel];
            if (ids.length < 2) return;
            const lessonsSet = new Set();
            ids.forEach(id => {
                const node = rawNodes.find(n => n.id === id);
                if (node) lessonsSet.add(node.text);
            });
            if (lessonsSet.size < 2) return;
            for (let i = 0; i < ids.length; i++) {
                for (let j = i + 1; j < ids.length; j++) {
                    const ni = rawNodes.find(n => n.id === ids[i]);
                    const nj = rawNodes.find(n => n.id === ids[j]);
                    if (!ni || !nj) continue;
                    if (ni.text === nj.text) continue;
                    const key = [ids[i], ids[j]].sort().join('|');
                    if (!crossPairs.has(key)) {
                        crossPairs.add(key);
                        rawEdges.push({ source: ids[i], target: ids[j], isCross: true, crossLabel: baseLabel });
                    }
                }
            }
        });

        // ============================================================
        // 4. ECharts 渲染
        // ============================================================
        const catMap = {
            '课文中心': 0,
            '板块': 1,
            '实词': 2,
            '虚词': 3,
            '凝固词组': 4,
            '句式': 5,
            '文化': 6
        };
        const categories = [
            { name: '课文中心', itemStyle: { color: '#1e293b' } },
            { name: '板块', itemStyle: { color: '#64748b' } },
            { name: '实词', itemStyle: { color: '#3b82f6' } },
            { name: '虚词', itemStyle: { color: '#f59e0b' } },
            { name: '凝固词组', itemStyle: { color: '#8b5cf6' } },
            { name: '句式', itemStyle: { color: '#10b981' } },
            { name: '文化', itemStyle: { color: '#ef4444' } }
        ];

        const nodes = rawNodes.map(n => {
            let size = 28;
            if (n.isTextCenter) size = 44;
            else if (n.isBlock) size = 18;
            let color = '#94a3b8';
            if (n.category === '实词') color = '#3b82f6';
            else if (n.category === '虚词') color = '#f59e0b';
            else if (n.category === '凝固词组') color = '#8b5cf6';
            else if (n.category === '句式') color = '#10b981';
            else if (n.category === '文化') color = '#ef4444';
            else if (n.category === '课文中心') color = '#1e293b';
            else if (n.category === '板块') color = '#64748b';
            return {
                id: n.id,
                name: n.label,
                category: catMap[n.category] !== undefined ? catMap[n.category] : 0,
                symbolSize: size,
                itemStyle: { color },
                raw: n,
                _relation: '',
                _isCrossNode: false
            };
        });

        const edges = rawEdges.map(e => ({
            source: e.source,
            target: e.target,
            lineStyle: {
                color: e.isCross ? '#ef4444' : '#94a3b8',
                width: e.isCross ? 2.5 : 1.0,
                curveness: e.isCross ? 0.3 : 0.1
            },
            isCross: e.isCross || false,
            crossLabel: e.crossLabel || '',
            silent: !e.isCross,
            emphasis: { disabled: true }
        }));

        const chartDom = document.getElementById('chart');
        const myChart = echarts.init(chartDom);

        let currentFilters = new Set(['all']);
        let currentHighlights = new Set();
        const lessonOrderArr = allLessonNames;

        // 核心渲染函数
        function buildOption(nodesData, edgesData, highlights) {
            const isHighlightActive = highlights.size > 0;
            const processedNodes = nodesData.map(n => {
                let itemStyle = { ...n.itemStyle };
                let labelStyle = { ...n.label };
                let symbolSize = n.symbolSize;
                const isMatch = n.raw && !n.raw.isTextCenter && !n.raw.isBlock && (() => {
                    const cat = n.raw.category || '';
                    const nodeStatus = n.raw.status || '';
                    const nodeRelFull = n.raw.relationFull || '';
                    const nodeRelArr = nodeRelFull.split(/[；;、]/).map(r => r.trim()).filter(Boolean);
                    if (n._relation && !nodeRelArr.includes(n._relation)) nodeRelArr.push(n._relation);
                    if (n.raw.entries) {
                        n.raw.entries.forEach(e => {
                            if (e.status && !nodeStatus) nodeStatus = e.status;
                            if (e.relationFull) {
                                e.relationFull.split(/[；;、]/).map(r => r.trim()).filter(Boolean).forEach(r => {
                                    if (!nodeRelArr.includes(r)) nodeRelArr.push(r);
                                });
                            }
                        });
                    }
                    const activeCats = [...highlights].filter(h => h.startsWith('cat-'));
                    const activeStatus = [...highlights].filter(h => h.startsWith('status-'));
                    const activeRels = [...highlights].filter(h => h.startsWith('rel-'));
                    const hasCross = highlights.has('cross');
                    if (activeCats.length === 0 && activeStatus.length === 0 && activeRels.length === 0 && !hasCross)
                        return false;
                    if (activeCats.length > 0 && !activeCats.some(h => h === 'cat-' + cat)) return false;
                    if (activeStatus.length > 0 && !activeStatus.some(h => h === 'status-' + nodeStatus)) return false;
                    if (activeRels.length > 0) {
                        const expanded = [];
                        activeRels.forEach(h => {
                            const k = h.replace('rel-', '');
                            if (typeof REL_GROUPS !== 'undefined' && REL_GROUPS['rel-' + k]) {
                                REL_GROUPS['rel-' + k].forEach(s => expanded.push(s.replace('rel-', '')));
                            } else expanded.push(k);
                        });
                        if (!expanded.some(r => nodeRelArr.some(nr => nr === r || nr.replace('・', '·') === r)))
                            return false;
                    }
                    if (hasCross) {
                        const baseL = n.raw.baseLabel || n.raw.label;
                        const allIds = labelMap[baseL] || [];
                        if (allIds.length < 2) return false;
                        const allLessons = new Set();
                        allIds.forEach(id => {
                            const nn = rawNodes.find(r => r.id === id);
                            if (nn && !nn.isTextCenter && !nn.isBlock) allLessons.add(nn.text);
                        });
                        if (allLessons.size < 2) return false;
                        const isAllFilter = currentFilters.has('all');
                        if (isAllFilter) {
                            return true;
                        } else {
                            const currentLesson = n.raw.text;
                            if (!allLessons.has(currentLesson)) return false;
                            const sorted = lessonOrderArr.filter(ls => allLessons.has(ls));
                            const idxInCross = sorted.indexOf(currentLesson);
                            if (idxInCross > 0) return true;
                            return false;
                        }
                    }
                    return true;
                })();
                if (isHighlightActive) {
                    if (isMatch) {
                        itemStyle = { ...itemStyle, borderColor: '#ef4444', borderWidth: 3, shadowBlur: 12,
                            shadowColor: 'rgba(239,68,68,0.4)' };
                        labelStyle = { ...labelStyle, fontWeight: 700, color: '#b91c1c', opacity: 1 };
                        symbolSize = (symbolSize || 28) * 1.3;
                    } else {
                        itemStyle = { ...itemStyle, opacity: 0.12 };
                        labelStyle = { ...labelStyle, opacity: 0.12 };
                    }
                }
                n._isHighlightMatch = isMatch;
                return { ...n, itemStyle, label: labelStyle, symbolSize };
            });
            const processedEdges = edgesData.map(e => {
                let lineStyle = { ...e.lineStyle };
                if (isHighlightActive) {
                    if (highlights.has('cross') && e.isCross) {
                        lineStyle = { ...lineStyle, width: 4, opacity: 1, color: '#ef4444' };
                    } else {
                        lineStyle = { ...lineStyle, opacity: 0.08 };
                    }
                }
                return { ...e, lineStyle };
            });
            return {
                tooltip: {
                    trigger: 'item',
                    triggerOn: 'mousemove',
                    showDelay: 600,
                    hideDelay: 50,
                    enterable: false,
                    alwaysShowContent: false,
                    formatter: function(params) {
                        if (params.dataType === 'edge') return '';
                        if (params.dataType === 'node') {
                            const d = params.data;
                            if (currentHighlights.size > 0 && d.raw && !d.raw.isTextCenter && !d.raw.isBlock) {
                                const processedNode = nodes.find(n => n.id === d.id);
                                if (processedNode && !processedNode._isHighlightMatch) return '';
                            }
                            if (d.raw && d.raw.isTextCenter) return `<strong>📄 ${d.name}</strong><br/>课文中心`;
                            if (d.raw && d.raw.isBlock) return '';
                            if (d.raw) {
                                let html = `<strong>${d.name}</strong>`;
                                if (d.raw.pinyin) html += `<br/>拼音：${d.raw.pinyin}`;
                                if (d.raw.category) html += `<br/>分类：${d.raw.category}`;
                                if (d.raw.text) html += `<br/>课文：${d.raw.text}`;
                                if (d.raw.entries && d.raw.entries.length > 0) {
                                    const firstSentence = d.raw.entries.map(e => e.sentence).filter(s => s && s.trim())[0];
                                    if (firstSentence) {
                                        const shortSentence = firstSentence.length > 30 ? firstSentence.slice(0, 30) +
                                        '…' : firstSentence;
                                        html += `<br/><span style="color:#94a3b8;font-size:11px;">「${shortSentence}」</span>`;
                                    }
                                }
                                return html;
                            }
                            return d.name;
                        }
                        return '';
                    }
                },
                legend: { show: false },
                series: [{
                    type: 'graph',
                    layout: 'force',
                    force: { repulsion: 450, edgeLength: [80, 280], gravity: 0.05, friction: 0.15,
                        layoutAnimation: true },
                    data: processedNodes,
                    edges: processedEdges,
                    categories: categories,
                    roam: true,
                    draggable: true,
                    focusNodeAdjacency: false,
                    emphasis: { disabled: true },
                    edgeSymbol: ['none', 'none'],
                    label: {
                        show: true,
                        position: 'bottom',
                        fontSize: 11,
                        fontWeight: 500,
                        color: '#1e293b',
                        offset: [0, 4],
                        formatter: function(params) {
                            if (params.data && params.data.raw && params.data.raw.isTextCenter) {
                                return '{bold|' + params.name + '}';
                            }
                            return params.name;
                        },
                        rich: { bold: { fontSize: 14, fontWeight: 700, color: '#1e293b' } }
                    },
                    lineStyle: { color: 'source', curveness: 0.1, width: 1.0, opacity: 0.5 },
                    itemStyle: { borderColor: '#ffffff', borderWidth: 2, shadowBlur: 4,
                        shadowColor: 'rgba(0,0,0,0.05)' },
                    symbolSize: function(value, params) {
                        if (params.data && params.data.raw && params.data.raw.isTextCenter) return 44;
                        if (params.data && params.data.raw && params.data.raw.isBlock) return 18;
                        return params.data.symbolSize || 28;
                    },
                    zoom: 0.6,
                    roam: true
                }]
            };
        }

        function renderGraph() {
            let filteredNodes = nodes;
            if (!currentFilters.has('all') && currentFilters.size > 0) {
                filteredNodes = nodes.filter(n => n.raw && currentFilters.has(n.raw.text));
            }
            const nodeIds = new Set(filteredNodes.map(n => n.id));
            let filteredEdges = edges.filter(e => nodeIds.has(e.source) && nodeIds.has(e.target));
            const crossLabels = new Set();
            edges.forEach(e => { if (e.isCross) crossLabels.add(e.crossLabel); });
            filteredNodes.forEach(n => {
                const bl = n.raw ? (n.raw.baseLabel || n.raw.label) : '';
                n._isCrossNode = crossLabels.has(bl) && !n.raw.isTextCenter && !n.raw.isBlock;
            });
            const option = buildOption(filteredNodes, filteredEdges, currentHighlights);
            myChart.setOption(option, true);
            myChart.resize();
        }

        renderGraph();

        // ============================================================
        // 5. 交互功能
        // ============================================================
        function toggleCatMenu() {
            document.getElementById('catMenu').classList.toggle('open');
            document.getElementById('statusMenu')?.classList.remove('open');
            document.getElementById('relMenu')?.classList.remove('open');
        }

        function toggleCatSubById(subId, toggleEl) {
            const sub = document.getElementById(subId);
            if (sub) sub.classList.toggle('open');
            if (toggleEl) toggleEl.classList.toggle('open');
        }

        function toggleCatHlDirect(btn) {
            const hl = btn.dataset.hl;
            btn.classList.toggle('active-cat');
            if (btn.classList.contains('active-cat')) { currentHighlights.add(hl); } else { currentHighlights.delete(hl); }
            updateCatBtnLabel();
            renderGraph();
        }

        function updateCatBtnLabel() {
            const active = [...currentHighlights].filter(h => h.startsWith('cat-'));
            const el = document.getElementById('catBtnLabel');
            if (!el) return;
            if (active.length > 0) {
                el.textContent = '分类 ✓ ' + active.map(h => h.replace('cat-', '')).join('/');
                el.style.color = '#1d4ed8';
            } else { el.textContent = '分类 ▾';
                el.style.color = ''; }
        }

        function toggleStatusMenu() {
            document.getElementById('statusMenu').classList.toggle('open');
            document.getElementById('catMenu').classList.remove('open');
            document.getElementById('relMenu').classList.remove('open');
        }

        function toggleStatusHl(btn) {
            btn.classList.toggle('active-cat');
            if (btn.classList.contains('active-cat')) { currentHighlights.add(btn.dataset.hl); } else { currentHighlights
                    .delete(btn.dataset.hl); }
            updateStatusBtnLabel();
            renderGraph();
        }

        function updateStatusBtnLabel() {
            const active = [...currentHighlights].filter(h => h.startsWith('status-'));
            const el = document.getElementById('statusBtnLabel');
            if (!el) return;
            if (active.length > 0) {
                el.textContent = '现状 ✓ ' + active.map(h => h.replace('status-', '')).join('/');
                el.style.color = '#1d4ed8';
            } else { el.textContent = '文中功能现状 ▾';
                el.style.color = ''; }
        }

        function toggleRelMenu() {
            document.getElementById('relMenu').classList.toggle('open');
            document.getElementById('catMenu').classList.remove('open');
            document.getElementById('statusMenu').classList.remove('open');
        }

        const REL_GROUPS = {
            'rel-语义层': ['rel-语义扩大', 'rel-语义缩小', 'rel-语义转移'],
            'rel-词类活用': ['rel-词类活用·名作动', 'rel-词类活用·形作动', 'rel-词类活用·使动', 'rel-词类活用·名作状'],
            'rel-句式': ['rel-省略句', 'rel-判断句', 'rel-定语后置', 'rel-被动句', 'rel-倒装句'],
        };

        function toggleRelHl(btn) {
            btn.classList.toggle('active-cat');
            if (btn.classList.contains('active-cat')) { currentHighlights.add(btn.dataset.hl); } else { currentHighlights
                    .delete(btn.dataset.hl); }
            syncRelParentStates();
            updateRelBtnLabel();
            renderGraph();
        }

        function toggleRelHlGroup(btn, groupKey) {
            const children = REL_GROUPS[groupKey] || [];
            btn.classList.toggle('active-cat');
            const isActive = btn.classList.contains('active-cat');
            children.forEach(h => { if (isActive) currentHighlights.add(h);
                else currentHighlights.delete(h); });
            document.querySelectorAll('.cat-sub-btn').forEach(sb => {
                if (children.includes(sb.dataset.hl)) {
                    sb.classList.toggle('active-hl', isActive);
                    sb.classList.toggle('active-cat', isActive);
                }
            });
            updateRelBtnLabel();
            renderGraph();
        }

        function syncRelParentStates() {
            const subBtns = document.querySelectorAll('.cat-sub-btn');
            const activeSubs = new Set();
            subBtns.forEach(sb => {
                if (sb.classList.contains('active-cat') || sb.classList.contains('active-hl')) {
                    activeSubs.add(sb.dataset.hl);
                }
            });
            Object.keys(REL_GROUPS).forEach(groupKey => {
                const children = REL_GROUPS[groupKey] || [];
                const parentBtn = document.querySelector('.cat-parent-btn[data-hl="' + groupKey + '"]');
                if (!parentBtn) return;
                const allActive = children.every(h => activeSubs.has(h));
                const someActive = children.some(h => activeSubs.has(h));
                if (allActive || someActive) {
                    parentBtn.classList.add('active-cat');
                } else {
                    parentBtn.classList.remove('active-cat');
                }
            });
        }

        function updateRelBtnLabel() {
            const active = [...currentHighlights].filter(h => h.startsWith('rel-'));
            const el = document.getElementById('relBtnLabel');
            if (!el) return;
            if (active.length > 0) {
                const names = active.map(h => h.replace('rel-', '').replace(/·/g, '·')).join('/');
                el.textContent = '关联 ✓ ' + names;
                el.style.color = '#1d4ed8';
            } else { el.textContent = '关联类型 ▾';
                el.style.color = ''; }
        }

        document.querySelectorAll('.hl-btn[data-hl="cross"]').forEach(btn => {
            btn.addEventListener('click', function() {
                this.classList.toggle('active-hl');
                if (this.classList.contains('active-hl')) {
                    currentHighlights.add('cross');
                } else {
                    currentHighlights.delete('cross');
                }
                renderGraph();
            });
        });

        document.getElementById('clearHl').addEventListener('click', function() {
            document.querySelectorAll('.hl-btn, .cat-sub-btn, .cat-menu-item').forEach(b => {
                b.classList.remove('active-hl');
                b.classList.remove('active-cat');
            });
            currentHighlights.clear();
            document.getElementById('catBtnLabel').textContent = '分类 ▾';
            document.getElementById('catBtnLabel').style.color = '';
            document.getElementById('statusBtnLabel').textContent = '文中功能现状 ▾';
            document.getElementById('statusBtnLabel').style.color = '';
            document.getElementById('relBtnLabel').textContent = '关联类型 ▾';
            document.getElementById('relBtnLabel').style.color = '';
            document.querySelectorAll('.hl-btn[data-hl="cross"]').forEach(b => b.classList.remove('active-hl'));
            renderGraph();
        });

        document.addEventListener('click', function(e) {
            if (!document.getElementById('catBtnWrap')?.contains(e.target))
                document.getElementById('catMenu').classList.remove('open');
            if (!document.getElementById('statusBtnWrap')?.contains(e.target))
                document.getElementById('statusMenu')?.classList.remove('open');
            if (!document.getElementById('relBtnWrap')?.contains(e.target))
                document.getElementById('relMenu')?.classList.remove('open');
        });

        // 篇目切换
        document.getElementById('lessonToggle').addEventListener('click', function() {
            const row = document.getElementById('lessonFilterRow');
            if (row.style.display === 'none') {
                row.style.display = 'flex';
                this.textContent = '📖 收起篇目';
            } else {
                row.style.display = 'none';
                this.textContent = '📖 篇目';
            }
        });

        document.querySelectorAll('#filterGroup .btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const val = this.dataset.text;
                if (val === 'all') {
                    currentFilters.clear();
                    currentFilters.add('all');
                    document.querySelectorAll('#filterGroup .btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                } else {
                    if (currentFilters.has('all')) {
                        currentFilters.clear();
                        document.querySelector('#filterGroup .btn[data-text="all"]').classList.remove('active');
                    }
                    if (currentFilters.has(val)) {
                        currentFilters.delete(val);
                        this.classList.remove('active');
                        if (currentFilters.size === 0) {
                            currentFilters.add('all');
                            document.querySelector('#filterGroup .btn[data-text="all"]').classList.add('active');
                        }
                    } else {
                        currentFilters.add(val);
                        this.classList.add('active');
                        trackLesson(val);
                    }
                }
                renderGraph();
            });
        });

        myChart.on('click', function(params) {
            if (params.dataType === 'node') {
                const data = params.data;
                const node = nodes.find(n => n.id === data.id);
                if (!node || !node.raw) return;
                if (node.raw.isTextCenter || node.raw.isBlock) return;
                trackNodeClick(node.raw.label, node.raw.text);
                showDetailPanel(node.raw);
                setTimeout(function() {
                    document.getElementById('detailPanel').classList.add('open');
                }, 10);
            }
            if (params.dataType === 'edge') {
                const edge = params.data;
                if (edge.isCross && edge.crossLabel && currentHighlights.has('cross')) {
                    showCrossModal(edge.crossLabel);
                }
            }
        });

        document.getElementById('closePanel').addEventListener('click', function() {
            document.getElementById('detailPanel').classList.remove('open');
        });

        const CAT_COLORS = { '实词': '#3b82f6', '虚词': '#f59e0b', '凝固词组': '#8b5cf6', '句式': '#10b981', '文化': '#ef4444' };

        // 显示详情面板
        function showDetailPanel(node) {
            const panel = document.getElementById('detailPanel');
            const title = document.getElementById('detailTitle');
            const body = document.getElementById('detailBody');
            title.innerHTML = `<span style="font-size:20px;font-weight:800;">${node.label}</span>` +
                (node.pinyin ? `<span style="font-size:12px;color:#94a3b8;font-weight:400;margin-left:8px;">${node.pinyin}</span>` :
                    '') +
                `<span style="font-size:10px;color:#fff;background:${CAT_COLORS[node.category] || '#64748b'};border-radius:10px;padding:1px 8px;margin-left:8px;vertical-align:middle;">${node.category || ''}</span>`;

            if (node.isCulture) {
                let html =
                    `<div class="detail-item"><span class="label">分类</span><span class="value"><span class="tag">文化</span></span></div>
                    <div class="detail-item"><span class="label">篇目</span><span class="value">${node.text || '-'}</span></div>`;
                if (node.cultureNote) {
                    html +=
                        `<div class="detail-item"><span class="label">拓展</span><div class="value" style="white-space:pre-wrap;font-size:13px;line-height:1.8;">${node.cultureNote}</div></div>`;
                } else if (node.entries.length && node.entries[0].note) {
                    html +=
                        `<div class="detail-item"><span class="label">拓展</span><div class="value" style="white-space:pre-wrap;font-size:13px;line-height:1.8;">${node.entries[0].note}</div></div>`;
                }
                body.innerHTML = html;
                panel.classList.add('open');
                return;
            }

            let html =
                `<div class="detail-item"><span class="label">篇目</span><span class="value">${node.text || '-'}</span></div>`;

            if (node.entries.length === 0) {
                html += `<div class="detail-item"><span class="value" style="color:#94a3b8;">无详细义项</span></div>`;
            } else {
                node.entries.forEach((entry, idx) => {
                    const num = idx + 1;
                    html += `<div class="entry-block">`;
                    const entryTitle = node.entries.length > 1 && entry.entryLabel && entry.entryLabel !== node.label ?
                        entry.entryLabel :
                        (node.entries.length > 1 ? '义项' + num : '');
                    if (entryTitle) html += `<div class="entry-title">${entryTitle}</div>`;
                    if (entry.wenZhongYi) {
                        html +=
                            `<div class="detail-item"><span class="label">文中义</span><div class="value">${entry.wenZhongYi}</div></div>`;
                    }
                    if (entry.sentence) {
                        const sentences = entry.sentence.split('\n').filter(s => s.trim());
                        const sHtml = sentences.map(s =>
                            `<div class="sentence-box indent">${s.trim()}</div>`
                        ).join('');
                        html +=
                            `<div class="detail-item"><span class="label">课文原句</span><div class="value">${sHtml}</div></div>`;
                    }
                    if (entry.xianDaiDuiYing) {
                        let xiandaiHtml = entry.xianDaiDuiYing;
                        if (/\d+[.、．]/.test(xiandaiHtml)) {
                            const parts = xiandaiHtml.split(/(?=\d+[.、．])/g).filter(s => s.trim());
                            xiandaiHtml = parts.map(p => `<div style="margin-bottom:2px;">${p.trim()}</div>`).join('');
                        }
                        html +=
                            `<div class="detail-item"><span class="label">现代对应</span><div class="value">${xiandaiHtml}</div></div>`;
                    }

                    }

                        html +=
                            `<div class="detail-item"><span class="label">文中功能现状</span><span class="value"><span class="status-badge">${entry.status}</span></span></div>`;
                    }
                    if (entry.relationFull) {
                        html +=
                            `<div class="detail-item"><span class="label">关联类型</span><span class="value"><span class="relation-badge">${entry.relationFull}</span></span></div>`;
                    }
                    if (entry.yanBianShuoMing) {

                            `<div class="detail-item"><span class="label">演变说明</span><div class="value evolve-note">${entry.yanBianShuoMing}</div></div>`;
                    }
                    html += `</div>`;
                });
            }

            // 跨课关联
            const bl = node.baseLabel || node.label;
            const crossIds = labelMap[bl] || [];
            const currentLessonIdx = lessonOrderArr.indexOf(node.text);
            const allCrossNodes = crossIds
                .map(id => rawNodes.find(n => n.id === id))
                .filter(n => {
                    if (!n || n.isTextCenter || n.isBlock) return false;
                    const idx = lessonOrderArr.indexOf(n.text);
                    return idx >= 0 && idx <= currentLessonIdx;
                });
            const hasOtherLessons = allCrossNodes.some(n => n.text !== node.text);

            if (hasOtherLessons) {
                const senseMap = new Map();
                const senseOrder = [];
                // 当前课节点优先，保证自身义项排在前面
                const sortedCrossNodes = [...allCrossNodes].sort((a, b) => {
                    const aIsCurrent = a.text === node.text ? 0 : 1;
                    const bIsCurrent = b.text === node.text ? 0 : 1;
                    return aIsCurrent - bIsCurrent;
                });
                sortedCrossNodes.forEach(cn => {
                    const lesson = cn.text || '未知篇目';
                    (cn.entries || []).forEach(entry => {
                        const sense = (entry.wenZhongYi || '').trim();
                        if (!sense) return;
                        const key = getSenseKey(sense);
                        if (!senseMap.has(key)) {
                            senseMap.set(key, []);
                            senseOrder.push(key);
                        }
                        if (entry.sentence && entry.sentence.trim()) {
                            entry.sentence.split('\n').filter(s => s.trim()).forEach(s => {

                    html += `</div>`;

            }

            const tuozhan = (() => {
                if (node.isCulture && node.cultureNote) return node.cultureNote;
                if (node.entries && node.entries.length > 0) {
                    const f = node.entries.find(e => e.note && e.note.trim());

        function getSenseKey(wenZhongYi) {
            const s = wenZhongYi.trim();
            if (/假设让步/.test(s) && /虽/.test(s)) return '假设让步，\u201c即使……，一定……\u201d';
            if (/事实让步|基于事实/.test(s) && /虽/.test(s)) return '事实让步，\u201c虽然......必定......\u201d';
            if (/表承接|然后|就/.test(s) && /连词/.test(s)) return '连词，表承接（然后、就）';
            if (/表转折|但是|却/.test(s) && /连词/.test(s)) return '连词，表转折（但是、却）';
            if (/表修饰|修饰/.test(s) && /连词/.test(s)) return '连词，表修饰（连接状语和动词，不译）';
            if (/连词.*转折/.test(s)) return '连词，表转折（但是、却）';
            if (/连词.*承接/.test(s)) return '连词，表承接（然后、就）';
            if (/结构助词|助词.*的/.test(s) && !/取独|取消|定语后置|音节/.test(s)) return '结构助词，相当于现代汉语"的"';
            if (/取独|取消.*独立/.test(s)) return '用在主谓之间，取消句子独立性，不翻译';
            if (/定语后置|后置.*标志/.test(s)) return '定语后置的标志，无实义，是古汉语特有语法标记';
            if (/音节助词|凑.*音节|补足音节/.test(s)) return '音节助词，凑足音节，不翻译';
            if (/动词.*到|动词.*往|动词.*去|动词.*前往/.test(s)) return '动词，到、前往某个地方';
            if (/代词.*指代|指代.*前文|代词.*它|代词.*他/.test(s) && !/指示/.test(s)) return '代词，指代前文提到的人或事物（他/她/它/这件事）';
            if (/的人|的事物|指代.*结构|者.*指/.test(s) || s.includes('……的人')) return '代词，……的人/事物';
            if (/指示代词|这|此(?!.*对)/.test(s) && !/判断|正确/.test(s)) return '指示代词，这、此';
            if (/判断.*动词|正确|对(?!.*面)/.test(s) && /是/.test(s)) return '判断动词，是（对/正确）';
            if (/在|从(?!.*对)|状语后置/.test(s) && /介词/.test(s) && !/对于|向|面/.test(s))
                return '介词，在/从/到（常与状语后置句式关联）';
            if (/对于|向|面对|面/.test(s) && /介词/.test(s)) return '介词，对于/向/面对（引出动作的对象）';
            if (/兼词|于此|于之|在那里|在这里/.test(s)) return '兼词，相当于"于此"（在那里/在这件事上）';
            if (/语气.*助词|句末|语气词/.test(s)) return '语气助词，用在句末，表示陈述或反问语气';
            if (/代词|哪里|怎么/.test(s) && !/兼/.test(s)) return '代词/疑问代词，哪里、怎么';
            if (/语气|句末|了/.test(s)) return '语气助词，表示"了"，用在句末表确认或感叹';
            if (/代词.*他|代词.*它|代词.*那/.test(s)) return '代词，他的/它的/那个';
            if (/反问|难道/.test(s)) return '语气副词，表反问（难道）';
            if (/推测|大概|也许/.test(s)) return '语气副词，表推测（大概、也许）';
            const parts = s.split(/[，,、；;]/);
            return parts[0].trim();
        }

        // 构建讲解视图（针对文化节点特殊处理）
        function buildLectureView(label) {
            const ids = labelMap[label] || [];
            const lectureBody = document.getElementById('modalLectureBody');

            // 对于文化类节点（如“说”、“托物言志”），直接显示各篇的说明文字
            const cultureNodes = ids.map(id => rawNodes.find(n => n.id === id)).filter(n => n && n.isCulture);
            if (cultureNodes.length > 0) {
                let html = `<div style="font-size:11px;color:#94a3b8;margin-bottom:10px;">各篇文化说明</div>`;
                cultureNodes.forEach(n => {
                    const note = n.cultureNote || (n.entries.length ? n.entries[0].note : '');
                    if (note) {
                        html += `<div class="lecture-sense-block" style="border-left-color:#ef4444;">
                            <div class="lecture-sense-title" style="color:#b91c1c;">📖 ${n.text}</div>
                            <div style="font-size:12px;color:#475569;line-height:1.6;white-space:pre-wrap;">${note}</div>
                        </div>`;
                    }
                });
                lectureBody.innerHTML = html;
                return;
            }

            // 普通字词：按义项归类
            const senseMap = new Map();
            const senseOrder = [];
            ids.forEach(id => {
                const node = rawNodes.find(n => n.id === id);
                if (!node || node.isTextCenter || node.isBlock) return;
                if (!currentFilters.has('all') && currentFilters.size > 0) {
                    if (!currentFilters.has(node.text)) return;
                }
                const lesson = node.text || '未知篇目';
                (node.entries || []).forEach(entry => {
                    const sense = (entry.wenZhongYi || '').trim();
                    if (!sense) return;
                    const key = getSenseKey(sense);
                    if (!senseMap.has(key)) {
                        senseMap.set(key, { title: sense, items: [] });
                        senseOrder.push(key);
                    }
                    if (entry.sentence && entry.sentence.trim()) {
                        senseMap.get(key).items.push({
                            lesson,
                            sentence: entry.sentence.trim(),
                            entryLabel: entry.entryLabel || label,
                            originalSense: sense
                        });
                    }
                });
            });

            if (senseOrder.length === 0) {
                lectureBody.innerHTML = '<div style="padding:12px;color:#94a3b8;text-align:center;">暂无义项数据</div>';
                return;
            }

            let html = `<div style="font-size:11px;color:#94a3b8;margin-bottom:10px;">按义项归类各篇例句</div>`;
            senseOrder.forEach((key, idx) => {
                const group = senseMap.get(key);
                html += `<div class="lecture-sense-block">
                    <div class="lecture-sense-title">
                        <span class="lecture-sense-num">${idx + 1}</span>${group.title}
                    </div>`;
                if (group.items.length === 0) {
                    html += `<div style="font-size:12px;color:#94a3b8;">（无例句）</div>`;
                } else {
                    group.items.forEach(item => {
                        html += `<div class="lecture-sentence-item">
                            <span class="lecture-lesson-tag">${item.lesson}</span>
                            <span class="lecture-sentence-text">${item.sentence}</span>
                        </div>`;
                    });
                }
                html += `</div>`;
            });
            lectureBody.innerHTML = html;
        }

        // ===== 搜索功能（优化排序 + 显示篇目） =====
        const searchInput = document.getElementById('searchInput');
        const searchResults = document.getElementById('searchResults');

        searchInput.addEventListener('input', function() {
            const query = this.value.trim();
            if (!query) { searchResults.classList.remove('open'); return; }
            const results = nodes.filter(n =>
                n.raw && !n.raw.isTextCenter && !n.raw.isBlock && (
                    n.raw.label.includes(query) ||
                    (n.raw.pinyin && n.raw.pinyin.includes(query)) ||
                    (n.raw.entries && n.raw.entries.some(e => e.wenZhongYi && e.wenZhongYi.includes(query))) ||
                    (n.raw.entries && n.raw.entries.some(e => e.xianDaiDuiYing && e.xianDaiDuiYing.includes(query)))
                )
            );
            // 排序：精确匹配 > 前缀匹配 > 其他
            results.sort((a, b) => {
                const aLabel = a.raw.label;
                const bLabel = b.raw.label;
                const aBase = a.raw.baseLabel || aLabel;
                const bBase = b.raw.baseLabel || bLabel;
                // 精确匹配（label或baseLabel完全等于查询词）
                const aExact = (aLabel === query || aBase === query);
                const bExact = (bLabel === query || bBase === query);
                if (aExact && !bExact) return -1;
                if (!aExact && bExact) return 1;
                // 前缀匹配
                const aPrefix = aLabel.startsWith(query) || aBase.startsWith(query);
                const bPrefix = bLabel.startsWith(query) || bBase.startsWith(query);
                if (aPrefix && !bPrefix) return -1;
                if (!aPrefix && bPrefix) return 1;
                return 0;
            });
            if (results.length === 0) {
                searchResults.innerHTML = `<div class="empty">当前未查到</div>`;
                searchResults.classList.add('open');
                return;
            }
            // 按分类分组
            const groups = { '实词': [], '虚词': [], '凝固词组': [], '句式': [], '文化': [] };
            results.forEach(n => {
                const cat = n.raw.category || '实词';
                if (groups[cat]) groups[cat].push(n);
                else groups['实词'].push(n);
            });
            let html = '';
            Object.keys(groups).forEach(cat => {
                if (groups[cat].length === 0) return;
                html += `<div class="result-group">
                    <div class="group-label">${cat}</div>
                    ${groups[cat].map(n => `
                        <div class="result-item" data-id="${n.id}">
                            <div class="ri-left">
                                <span class="ri-word">${n.raw.label} <span style="font-weight:400;font-size:10px;color:#94a3b8;">${n.raw.pinyin || ''}</span></span>
                                <span class="ri-desc">${n.raw.text} · ${n.raw.entries.length ? n.raw.entries[0].wenZhongYi || '' : ''}</span>
                            </div>
                            <span class="ri-tag">${cat}</span>
                        </div>
                    `).join('')}
                </div>`;
            });
            searchResults.innerHTML = html;
            searchResults.classList.add('open');
            // 点击结果项跳转
            searchResults.querySelectorAll('.result-item').forEach(item => {
                item.addEventListener('click', function() {
                    const id = this.dataset.id;
                    const node = nodes.find(n => n.id === id);
                    if (node && node.raw) {
                        trackSearch();
                        trackNodeClick(node.raw.label, node.raw.text);
                        showDetailPanel(node.raw);
                        myChart.dispatchAction({ type: 'highlight', seriesIndex: 0, dataIndex: nodes
                                .findIndex(n => n.id === id) });
                        setTimeout(() => { myChart.dispatchAction({ type: 'downplay', seriesIndex: 0 }); },
                            3000);
                        searchResults.classList.remove('open');
                        searchInput.value = '';
                    }
                });
            });
        });

            if (nodeLesson) _lessonsUsed.add(nodeLesson);
        }

        // 记录跨课关联使用
        function trackCrossModal() {
            if (!_sessionStart) return;
            _crossCount++;
        }

        // 记录搜索使用
        function trackSearch() {
            if (!_sessionStart) return;
            _searchCount++;
        }

        // 记录筛选篇目
        function trackLesson(lessonName) {
            if (!_sessionStart || !lessonName || lessonName === 'all') return;
            _lessonsUsed.add(lessonName);
        }

        // 提交数据到 Google 表单
        function submitData() {
            if (!_sessionStart || !_userName) return;
            const durationMin = Math.max(1, Math.round((Date.now() - _sessionStart) / 60000));
            const now = new Date();
            const timeStr = now.getFullYear() + '-'
                + String(now.getMonth()+1).padStart(2,'0') + '-'
                + String(now.getDate()).padStart(2,'0') + ' '
                + String(now.getHours()).padStart(2,'0') + ':'
                + String(now.getMinutes()).padStart(2,'0');

            // 节点详情截断，避免超长
            let detailStr = _clickDetail.slice(0, 60).join(' → ');
            if (_clickDetail.length > 60) detailStr += '…(共' + _clickDetail.length + '次)';

            const params = new URLSearchParams();
            params.append(ENTRY.name,        _userName);
            params.append(ENTRY.id,          _userId);
            params.append(ENTRY.duration,    durationMin + '分钟');
            params.append(ENTRY.clickTotal,  _clickTotal);
            params.append(ENTRY.clickDetail, detailStr || '无');
            params.append(ENTRY.crossCount,  _crossCount);
            params.append(ENTRY.searchCount, _searchCount);
            params.append(ENTRY.lessons,     [..._lessonsUsed].join('、') || '无');
            params.append(ENTRY.submitTime,  timeStr);

            // 用 fetch no-cors 方式提交（静默提交，不跳转）
            fetch(FORM_BASE, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: params.toString()
            }).catch(function() {});
        }

        // 离开页面时提交
        window.addEventListener('beforeunload', submitData);
        // 每5分钟自动备份提交一次（防止长时间使用后关闭没有触发beforeunload）
        setInterval(function() {
            if (_sessionStart && _userName) submitData();
        }, 300000);

        console.log('📖 古代汉语知识图谱（全七课完整版）已加载');
        console.log(`共 ${nodes.length} 个节点，${edges.length} 条边`);
    </script>
</body>
</html>
