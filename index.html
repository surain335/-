            ["精卫填海", "文", "实词", "wén", "花纹（通假字，同 \"纹\"）", "1.现专用 \"纹\" 字表示花纹、纹理，如：纹身、纹路、花纹。\n2.“文”现在常表示文采、文章、文化、文学", "", "文首，白喙，赤足", "通假字", "上古时期以 “文” 承载花纹本义，后世汉字分化出新字 “纹” 专门承担该语义，“文” 不再用以表示花纹含义", "", false, "", "通假字"],
            ["精卫填海", "首", "实词", "shǒu", "头、脑袋", "1.头，脑袋：～饰。～级。～肯（点头表示同意）。\n2.领导的人，带头的：～领。元～。～脑。～相（xiàng）。\n3.第一，最高：～都（dū）。～府。\n4.最先，最早：～次。～届。～创。～日封。～义", "", "文首", "语义转移", "“首” 表示头的本义古今一致，但现代汉语使用频率略有下降。，本义指头（人体部位），后引申为“首先、首领” 等，从具体事物转为抽象指代，语义转移。", "", false, "频率下降", "语义转移"],
            ["精卫填海", "喙", "实词", "huì", "鸟兽的嘴", "名词，鸟类、兽类的嘴部", "鸟喙、喙突、不容置喙", "赤喙", "", "古代专指鸟兽的嘴，现代汉语仅在书面、生物学语境中使用，日常口语都说 “嘴、嘴巴”。", "", false, "受限", ""],
            ["精卫填海", "赤", "实词", "chì", "红色", "形容词，大红色；也可作动词", "赤色、赤红、面红耳赤", "赤喙", "", "“赤” 表示红色的含义古今一致，现代汉语依然常用，还延伸出 “忠诚、空无” 等引申义。", "", false, "稳定", ""],
            ["精卫填海", "曰", "实词", "yuē", "本义为“说”；文中指“称为”", "现代口语不用，仅存于书面语：名曰、美其名曰、凡乐辞～诗，诗声～歌", "", "名曰精卫", "", "“曰”的“说”义没有变化，但这个字现代口语中不使用，只在古文引用中出现（如“子曰”）。", "文言文常用义项：\n1.说：子～诗云。\n2.为（wéi ），是：一～水，二～火，三～木，四～金，五～土。", false, "受限", ""],
            ["精卫填海", "鸣", "实词", "míng", "鸟叫、鸣叫", "动词，鸟兽叫；也指发出声音", "鸣叫、鸟鸣、雷鸣、百家争鸣", "其鸣自詨", "", "", "", false, "稳定", ""],
            ["精卫填海", "少女", "实词", "shào nǚ", "小女儿", "年轻未婚女子：少女时代、青春少女", "", "是炎帝之少女，名曰女娃", "语义扩大", "古今词义为语义扩大关系。本义专指贵族家中最小的女儿；后世词义范围向外拓展，不再局限于贵族幼女，泛指一切年轻、未婚的女子。本义如今仅留存古文语境，现代汉语只用拓展后的宽泛含义，本义日常不再使用。", "", false, "受限", "语义扩大"],
            ["精卫填海", "游", "实词", "yóu", "游玩、游泳", "动词，玩耍；在水中行动", "游泳、游玩、旅游、游山玩水", "游于东海", "", "", "", false, "稳定", ""],
            ["精卫填海", "溺", "实词", "nì", "动词，溺水、淹没", "动词，沉在水里；也指沉迷", "溺水、溺亡、溺爱、沉溺", "溺而不返", "", "", "", false, "稳定", ""],
            ["精卫填海", "为", "实词", "wéi", "成为、变成", "动词，变成、作为", "成为、变为、化为乌有", "故为精卫", "多音多义", "“为” 表 “变成、做” 的核心含义古今一致，现代汉语依然高频使用，义项十分丰富。", "1. 读 wéi（第二声）\n主要做动词，意思是：做、是、当作、变成。\n\n- 做：努力作为、行为\n- 是：十为一斤\n- 当作：以为、认为\n- 变成：成为\n\n2. 读 wèi（第四声）\n主要做介词，意思是：替、给、为了、因为。\n\n- 替：为你做事\n- 为了：为了学习\n- 因为：因为下雨", false, "稳定", "多音多义"],
            ["精卫填海", "衔", "实词", "xián", "用嘴含、叼着", "动词，嘴里叼着，如：衔着；也指衔接、头衔", "", "常衔西山之木石", "", "", "", false, "稳定", ""],
            ["精卫填海", "堙", "实词", "yīn", "填塞", "堵塞：～窒。～郁（闷塞，气郁结不畅）。", "", "常衔西山之木石，以堙于东海", "", "“堙” 的 “填塞” 义没有变化，但现代很少使用这个字，只在极少数书面词语中偶见，字的使用受限而非义变。", "", false, "受限", ""],
            ["精卫填海", "之", "虚词", "zhī", "代词，代指前文提到的人或事物", "\"之\"作指示代词，现代对应词为**\"这、此\"", "久而久之、总之、反之、之前、之后、之间。", "发鸠之山", "", "\"之\"作指示代词，古代常用于指代上文提及的人或事物（相当于\"这/此\"），后逐渐被\"这\"\"此\"等替代，现代汉语口语中已基本消失，仅在\"总之\"\"反之\"\"之前\"\"之后\"等固定格式中保留书面语残余，使用频率下降。", "", false, "频率下降", ""],
            ["精卫填海", "之", "虚词", "zhī", "结构助词“的”", "现代通用助词\"的\"承担相同功能，书面语仍沿用\"之\"：祖国之山河、友人之书信", "", "发鸠之山／是炎帝之少女／常衔西山之木石", "", "现代汉语用助词 “的” 承接同类语法作用", "", false, "频率下降", ""],
            ["精卫填海", "焉", "虚词", "yān", "兼词，相当于 \"于之 / 于是\"（在这里）", "现代不单用，仅存于固定短语：心不在焉、语焉不详、三人行必有我师焉", "", "有鸟焉，其状如乌", "", "文言特有的兼词用法在现代汉语中基本不再使用，该语义仅留存于心不在焉、语焉不详这类固定书面成语之内", "", false, "受限", ""],
            ["精卫填海", "是", "虚词", "shì", "指示代词：这 / 这个", "这，此：", "～日。～可忍，孰不可忍。比比皆～。", "是炎帝之少女，名曰女娃", "", "文中指示代词 “这、这个” 的用法现代汉语中基本消失，该字经语法化路径演变为现代汉语判断句核心词，现代主要表示判断-是不是", "", false, "受限", ""],
            ["精卫填海", "于", "虚词", "yú", "介词，在、从；古句式：动词+于+宾语", "介词，引出地点、对象", "在于、位于、生于", "游于东海", "", "古代 “于” 是高频介词，现代汉语介词功能保留，但口语很少单用 “于”，多用 “在、对” 替代，“于” 多用于书面、合成词。", "", false, "频率下降", ""],
            ["精卫填海", "故", "虚词", "gù", "所以、因此，表因果", "因果连词，引出结果", "故此、故......", "故为精卫", "", "古代 “故” 作因果连词非常高频，现代汉语该用法仅留存于书面语，日常口语多用 “所以、因此” 替代。", "", false, "频率下降", ""],
            ["精卫填海", "以", "虚词", "yǐ", "连词，来、用来，表目的关系", "目的连词，引出动作目的", "用以、以便、以儆效尤", "以堙于东海", "", "古代 “以” 作目的连词很常用，现代汉语该用法仅留存于书面语、成语中，日常多用 “来、用来” 替代。", "", false, "频率下降", ""],
            ["精卫填海", "其", "虚词", "qí", "第三人称物主代词，他的、它的、他们的", "它的", "其形、其声", "其状如乌、其鸣自詨", "", "文言常用物主代词，可代动植物事物；现代汉语口语直接用“它的”，“其”仅书面、古文使用", "", false, "频率下降", ""],
            ["精卫填海", "自 + V 构词", "固定格式", "", "文言 \"自\"+ 单音节动词表反身动作", "现代高频构词法，能产性强", "自夸、自卫、自救、自残、自荐、自恋、自学、自律", "名曰：“精卫”，其鸣自詨（xiāo）（自己呼叫自己）", "固定格式", "构词模式从古沿用至今，现代汉语依旧高频使用该构词方式", "", false, "稳定", "固定格式"],
            ["精卫填海", "“于”状语后置", "句式", "", "状语后置，介词结构（于 + 宾语）后置于动词", "现代状语多前置", "他在东海游玩（现代）←女娃游于东海（古）", "女娃游于东海／常衔西山之木石，以堙于东海", "倒装句", "状语后置是古代汉语特有的语序，现代汉语中状语放在动词前面。", "", false, "受限", "倒装句"],
            ["精卫填海", "精卫", "文化", "Jīng wèi", "", "", "", "名曰精卫", "文化", "", "本是上古神话中的鸟名，后来演化为 “意志坚定、不畏艰难” 的文化象征，现代汉语中这个典故义依然常用。", true, "", "文化"],
            ["精卫填海", "发鸠", "文化", "Fā jiū", "", "", "", "发鸠之山", "文化", "", "古代神话中的山名，传说在今山西长子县", true, "", "文化"],
            ["精卫填海", "炎帝", "文化", "Yán dì", "", "", "", "炎帝之少女", "文化", "", "神农氏，中国传说中的上古部落首领，传说中发明农业、医药的上古帝王，与黄帝并称 “炎黄”。现在是华夏人文始祖的文化符号，“炎黄子孙” 等说法至今高频使用。", true, "", "文化"],
            ["精卫填海", "《山海经》", "文化", "shān hǎi jīng", "", "", "", "", "文化", "", "《山海经》是古代地理名著。全书共 18 卷，分 \"山经\" 和 \"海经\" 两大部分。作为中国最古老的奇书之一，它充满了神话、地理和想象，涵盖了中国古代山川、各地民俗、物产资源以及大量神异鬼怪的传说，是中华民族文化宝库中的璀璨明珠。文化典籍古今价值稳定，长期用于上古神话与地理溯源研究。", true, "", "文化"],
            ["精卫填海", "精卫填海（成语）", "文化", "jīng wèi tián hǎi", "", "", "", "", "文化", "", "本课讲述炎帝小女儿女娃在东海游玩时溺水身亡，死后化为精卫鸟，日复一日衔树枝、石块想要填平大海的神话故事。课文主题是赞美坚持不懈、不畏艰难、执着坚守的品质。成语《精卫填海》比喻意志坚定，持之以恒地克服困难、追求目标。\n\n例句\n1. 学习汉语并不容易，我们要有精卫填海的精神，坚持每天练习。\n2. 他凭着精卫填海般的毅力，顺利完成了这项艰巨的任务。\n3. 只要拥有精卫填海的恒心，再大的困难也能慢慢克服。\n4. 精卫填海的故事激励着我们，做事不要半途而废。", true, "", "文化"],
            // ===== 夸父逐日 =====
            ["夸父逐日", "逐", "实词", "zhú", "追赶", "1.强迫离开：～客令。放～。驱～。\n2.依照先后次序，一一挨着：～步。～个。～渐。～年。～一。\n3.追赶：～鹿（喻争夺天下）。角（jué）～（争相取胜）。追～。笑～颜开。", "", "夸父与日逐走，入日", "", "逐\n古义：本义专指追赶兽类 / 非人对象，如打猎追猎、追逐太阳；引申为竞争、角逐（如 “逐走”“逐鹿中原”）、驱逐、放逐。追赶义从古至今均为常用语义，较为稳定。", "（为什么《夸父与日逐走》用 “逐”）\n古代 “追” 和 “逐” 用法不一样：\n追：只用来追人。\n逐：用来追动物、太阳等非人的东西，也表示 “比赛”。\n夸父追赶的对象是太阳，而且是和太阳比赛，所以用 “逐”，不用 “追”。", false, "稳定", ""],
            ["夸父逐日", "走", "实词", "zǒu", "跑（古义）", "1.行：～路。～步。\n2.古代指奔跑：～马。不胫而～。奔～相告。", "", "夸父与日逐走，入日", "语义转移", "课文中 “走” 是 “跑” 的意思。现代 “走” 的常用义变成了 “步行”，“跑” 义只保留在成语 “不胫而走”“走马观花”“奔走相告” 中。", "", false, "受限", "语义转移"],
            ["夸父逐日", "入", "实词", "rù", "进入、落到", "动词，进到里面", "进入、入口、入迷、出生入死", "入日", "", "", "", false, "稳定", ""],
            ["夸父逐日", "欲", "实词", "yù", "想要、打算", "动词，希望、想要", "欲望、欲求、欲罢不能", "渴，欲得饮", "", "", "", false, "稳定", ""],
            ["夸父逐日", "北", "实词", "", "名词 \"北\" 活用作状语：向北", "现代需说向北", "向北走", "北饮大泽", "词类活用·名作状", "与前文精卫填海 “北” 名作状用法一致，文言名词可直接作状语，现代汉语需搭配介词", "", false, "", "词类活用·名作状"],
            ["夸父逐日", "饮", "实词", "yǐn", "喝；也指喝的水", "动词 / 名词，喝水、饮品", "饮水、饮料、饮食、饮水思源", "欲得饮", "多音多义", "", "另读 yìn，指给牲畜喝水，本课读 yǐn。", false, "稳定", "多音多义"],
            ["夸父逐日", "足", "实词", "zú", "够、充足", "形容词，足够、满", "足够、充足、满足、丰衣足食", "河、渭不足", "语义转移", "本义是 “脚”，语义转移，引申为 “足够、充足”，现代汉语中本义和引申义都很常用，词义范围比古代更大。", "", false, "稳定", "语义转移"],
            ["夸父逐日", "泽", "实词", "zé", "水积聚的地方，大湖泊", "名词，湖泊、水洼", "沼泽、湖泽、润泽、恩泽", "北饮大泽", "语义转移", "本义是 “水聚积的洼地”，现代汉语书面语中保留本义，还延伸出 “湿润、恩惠” 等引申义，语义转移。", "", false, "频率下降", "语义转移"],
            ["夸父逐日", "至", "实词", "zhì", "到达", "义未变，但使用场域收窄为固定短语", "至此、至今、至死不悟、自始至终", "未至，道渴而死", "", "文言中 “到达” 的核心词义古今未发生改变，只是现代汉语里该字较少单独作谓语动词，多凝结在固定短语当中，核心语义仍常用。", "", false, "稳定", ""],
            ["夸父逐日", "道", "实词", "dào", "名作状：在路上（现代无此用法）", "名词充当状语是文言特殊活用手法，现代汉语需依靠介词短语实现该语义", "", "未至，道渴而死", "词类活用·名作状", "", "1.路，方向，途径：～路。铁～。志同～合。\n2.指法则、规律：～理。～德。～义。得～多助，失～寡助。\n3.方法，办法，技术：门～。医～。\n4.说，讲：～白。常言～。能说会～。", false, "", "词类活用·名作状"],
            ["夸父逐日", "弃", "实词", "qì", "（会意字，本义，用双手将婴儿抛掉）文中为引申义：扔掉；舍去", "扔掉；舍去", "弃权、放弃、抛弃、前功尽弃", "弃其杖，化为邓林", "", "文中义在现代为常用义。", "注意：词义本义从抛扔婴儿这一具体动作，拓展为舍弃各类人、事物的抽象含义，属于”语义演变扩大“。", false, "稳定", ""],
            ["夸父逐日", "杖", "实词", "zhàng", "手杖、拐杖", "名词，走路扶着的棍子", "手杖、拐杖、权杖", "弃其杖", "", "", "", false, "稳定", ""],
            ["夸父逐日", "化", "实词", "huà", "变化、变成", "动词，改变、转化", "变化、转化、化为乌有、千变万化", "化为邓林", "", "", "", false, "稳定", ""],
            ["夸父逐日", "未", "虚词", "wèi", "没有、还没", "否定副词，表还没完成", "未必、未曾、未来、前所未有", "未至，道渴而死", "", "“未” 表 “还没有” 的副词含义古今一致，现代汉语依然高频使用，多用于书面、正式表达，口语多用 “没、没有”。", "", false, "稳定", ""],
            ["夸父逐日", "而", "虚词", "ér", "连词表修饰，前词表方式状态，后词表动作", "表修饰，连接状语和中心语", "侃侃～谈", "道渴而死", "", "表修饰的用法现代汉语仅留存于书面、成语中，日常多用 “地、着” 或直接连接表达修饰关系。", "", false, "频率下降", ""],
            ["夸父逐日", "其", "虚词", "qí", "第三人称物主代词，他的、它的、他们的", "他的", "其人、其父", "弃其杖", "", "文言同一字形兼具代人、代物两种用法；现代口语拆分“他的/它的”，“其”书面留存", "", false, "频率下降", ""],
            ["夸父逐日", "弃 + N/V 构词", "固定格式", "", "文言 \"弃\" 作词素构成名词或动词", "现代构词法延续", "弃儿、弃婴、弃妇；弃学、弃权、弃耕", "弃其杖，化为邓林", "固定格式", "以 “弃” 为构词词素的组合模式传承至今，现代汉语仍大量使用", "", false, "稳定", "固定格式"],
            ["夸父逐日", "“于”状语后置", "句式", "", "状语后置，介词结构（于 + 宾语）后置于动词", "现代状语前置", "到黄河喝水（现代）←饮于河（古）", "饮于河、渭", "倒装句", "文言介词结构后置为固定语序特点，现代汉语需将介宾短语前置", "", false, "受限", "倒装句"],
            ["夸父逐日", "“曰”省略主语", "句式", "", "主语省略，省略“曰”之前的主语", "现代对话一般补出主语，不省略", "A 说：……（B）说：……", "（夸父）未至，道渴而死；（夸父）弃其杖", "省略句", "文言对话常见省略用法，依靠上下文明确指代；现代汉语口语、书面语大多补全主语，很少此类省略形式", "", false, "受限", "省略句"],
            ["夸父逐日", "夸父", "文化", "Kuā fù", "", "", "", "夸父逐日", "文化", "", "本是上古神话中的巨人形象，后来演化为 “志向宏大、不懈追求” 的文化象征，现代汉语中这个典故义依然常用，有时也含贬义，指脱离实际、不自量力。", true, "", "文化"],
            ["夸父逐日", "河", "文化", "Hé", "", "", "", "饮于河、渭", "文化", "", "古代 “江、河” 都是专名，分别指长江、黄河，后来泛化为所有江河的统称。", true, "", "文化"],
            ["夸父逐日", "渭", "文化", "Wèi", "", "", "", "饮于河、渭", "文化", "", "又称渭水，是关中平原的母亲河，古代是重要的地理标志。渭河、渭水、泾渭分明。", true, "", "文化"],
            ["夸父逐日", "邓林（桃文化）", "文化", "dèng lín", "", "", "", "弃其杖，化为邓林", "文化", "", "邓林：传说地名，一说为桃林。\n桃木：民间镇邪避凶；桃花源喻理想境地；蟠桃为仙界意象。桃木剑、桃符、世外桃源、蟠桃宴", true, "", "文化"],
            ["夸父逐日", "夸父逐日（成语）", "文化", "kuā fù zhú rì", "", "", "", "篇名", "文化", "", "“夸父逐日”出自《山海经·海外北经》的上古神话，字面义为夸父追赶太阳；在后世使用中发展出褒贬兼具的双重喻义。褒义上用以比喻志向宏伟、执着坚韧，为追求理想甘愿付出、一往无前，我们既可以说“科研工作者以夸父逐日的精神，在基础学科领域持续深耕、久久为功”。贬义上则指脱离实际、不自量力，盲目追逐远超自身能力的目标，最终徒劳无功，比如“你还没打好专业基础就去挑战顶级赛事，未免有些夸父逐日，循序渐进才更稳妥。”", true, "", "文化"],
            // ===== 自相矛盾 =====
            ["自相矛盾", "矛", "实词", "máo", "长矛，古代刺杀类兵器", "名词，古代长柄兵器", "长矛、矛盾、矛头、矛枪", "楚人有鬻盾与矛者", "", "古代兵器专名，现代汉语中本义仅在历史、古文语境使用，“矛盾” 的引申义（冲突、对立）非常常用。", "", false, "频率下降", ""],
            ["自相矛盾", "盾", "实词", "dùn", "盾牌，古代防护类兵器", "名词，古代护身兵器", "盾牌、矛盾、后盾、护盾", "楚人有鬻盾与矛者", "语义扩大", "古代兵器专名，本义保留，还延伸出 “后盾、支撑” 的抽象引申义，词义范围扩大，日常使用频率高。", "", false, "稳定", "语义扩大"],
            ["自相矛盾", "鬻", "实词", "yù", "动词，卖、出售", "现代汉语中该用法仅存于书面文言、成语中，口语用 \"卖\" 替代", "卖官鬻爵、鬻画为生", "楚人有鬻盾与矛者", "", "“鬻” 是 “卖” 的意思，词义没有变化，但这个字现代口语不使用，仅出现在文言书面语中。现代用 “卖”。", "", false, "受限", ""],
            ["自相矛盾", "誉", "实词", "yù", "动词，称赞、夸赞、夸耀", "1. 称扬，赞美：毁～。交口称～。\n2.名声：荣～。名～。信～。沽名钓～。", "", "誉之曰", "语义扩大", "“誉” 的动词 “称赞” 义仍常用（如 “赞誉”“交口称誉”），同时语义扩大，扩展出更常用的“名声” 义（如 “荣誉”“信誉”）。", "", false, "稳定", "语义扩大"],
            ["自相矛盾", "坚", "实词", "jiān", "坚固、结实、硬", "形容词，牢固、硬", "坚固、坚硬、坚定、坚不可摧", "吾盾之坚", "", "“坚” 表示 “硬、牢固” 的核心含义古今一致，现代汉语依然高频使用。", "", false, "稳定", ""],
            ["自相矛盾", "陷", "实词", "xiàn", "掉进，坠入。文中指“刺穿、刺破、穿透”", "1. 掉进，坠入，沉下：～落。～没（mò）。～溺。～于。～入。\n　2. 为捉野兽挖的坑：～坑。～阱。\n　3. 凹进：双眼深～。\n　4. 设计害人：～害。诬～。～人于罪。\n　5. 攻破，占领：失～。沦～。\n　6. 缺点：缺～。", "", "物莫能陷也 / 于物无不陷也", "", "现代 “陷” 的常用义仍是 “掉进、陷入”", "", false, "稳定", ""],
            ["自相矛盾", "利", "实词", "lì", "锋利、锐利", "形容词，刃口快、尖锐", "锋利、锐利、利益、利害得失", "吾矛之利", "", "现代汉语保留。", "", false, "稳定", ""],
            ["自相矛盾", "应", "实词", "yìng", "回答、回应", "动词，答复、应答", "回应、答应、应答、应声回答", "弗能应也", "多音多义", "现代汉语保留。", "多音多义字，表应该读 yīng，表回应读 yìng。", false, "稳定", "多音多义"],
            ["自相矛盾", "立", "实词", "lì", "存在、成立", "动词，立足、存在", "成立、立足、站立、立身处世", "不可同世而立", "", "现代汉语保留。", "", false, "稳定", ""],
            ["自相矛盾", "与", "虚词", "yǔ", "并列连词，和、同", "并列连词，连接两个同等成分", "我～你。山～水。", "鬻盾与矛者", "", "现代汉语保留。", "", false, "稳定", ""],
            ["自相矛盾", "之", "虚词", "zhī", "代词，代指前文提到的人或事物", "现代口语用 \"它 / 他\" 替代，书面语 / 成语中保留代词用法", "置之不理、求之不得、言之有理", "誉之曰", "", "“之” 作代词相当于 “它”，口语中用 “它 / 他”，书面语和成语中保留。", "", false, "频率下降", ""],
            ["自相矛盾", "之", "虚词", "zhī", "处于主谓之间，取消句子独立性的用法。", "现代汉语中该用法主要在仿古书面语中偶见残余，例词：生命之脆弱令人叹息、时光之流逝不可阻挡。", "草木之香、山河之辽阔、岁月之流逝", "吾盾之坚/ 吾矛之利", "", "古代\"之\"插入主谓间使结构名词化，现代汉语相应功能由\"的\"字结构替代，之的使用频率下降。", "", false, "频率下降", ""],
            ["自相矛盾", "之", "虚词", "zhī", "结构助词，连接定语和中心语，表领属 / 修饰关系，译为 \"的\"", "现代汉语用助词 \"的\" 承担相同功能，书面语中仍保留 \"之\" 的用法", "少年之志、文明之光、历史之痕迹。", "以子之矛陷子之盾", "", "“之” 作助词相当于 “的”，口语中用 “的”，书面语中保留。", "", false, "频率下降", ""],
            ["自相矛盾", "莫", "虚词", "mò", "没有、不，表否定", "否定副词，没有什么（人 / 物）", "莫非、莫如、一筹莫展", "物莫能陷也", "", "古代 “莫” 作否定副词 “没有” 很常用，现在这个用法仅留存于成语、书面语，日常 “莫” 多用于 “不要” 的祈使义。", "", false, "频率下降", ""],
            ["自相矛盾", "于", "虚词", "yú", "介词，引出动作对象，译为“在、被、向、对于、对”", "介词，引出关涉对象", "对于、关于、在于", "于物无不陷也", "", "古代 “于” 是高频介词，现代汉语对象义保留，但口语很少单用 “于”，多用 “对、对于” 替代，“于” 多用于书面。", "", false, "频率下降", ""],
            ["自相矛盾", "或", "虚词", "huò", "无定代词，有的（人）", "也许，有时，表示不定的词：～许。～者", "", "或曰", "", "古代 “或” 作代词 “有人” 很常用，现在这个代词义基本不用，最常用作连词 “或者”，核心词性和词义发生转移。", "", false, "受限", ""],
            ["自相矛盾", "子", "虚词", "zǐ", "您，对对方的尊称", "1.古代指儿女，现专指儿子：～女。～孙。～嗣。～弟（后辈人，年轻人）。\n2.植物的果实、种子：菜～。瓜～儿。～实。", "", "以子之矛", "", "古代 “子” 是通用尊称，相当于 “您”，现在这个尊称义仅留存于 “孔子、子曰” 等古文化词汇里，日常 “子” 多指儿子、种子。", "古代对男子的美称、尊称，也用在姓氏后表尊敬，如 “韩非子”。", false, "受限", ""],
            ["自相矛盾", "其", "虚词", "qí", "指示代词，意为那、那个、那些", "指示代词，指代前文提到的人 / 物", "其、那、其中", "其人弗能应也", "", "古代 “其” 作指示代词非常高频，现代汉语该用法仅留存于书面语，日常多用 “那、那个” 替代。", "", false, "频率下降", ""],
            ["自相矛盾", "弗", "虚词", "fú", "否定副词，用法同 \"不\"，译为 \"不、不能\"", "仅存于固定成语、文言文中，口语已不再使用", "自愧弗如、弗能、弗敢", "其人弗能应也", "", "“弗” 相当于 “不”，现代口语不使用，只保留在成语 “自愧弗如” 等书面语中。", "", false, "频率下降", ""],
            ["自相矛盾", "夫", "虚词", "fú", "句首发语词，引出议论，无实义", "句首语气助词，开启话题", "夫、夫战，勇气也", "夫不可陷之盾", "多音多义", "古汉语特有的句首发语词，现代汉语没有对应用法，仅在古文中出现。", "夫读fū时，本义指所有成年男子，后来词义收窄，只指女子的配偶，语义缩小；夫读fú时，是文言语气助词，现代不用。", false, "受限", "多音多义"],
            ["自相矛盾", "而", "虚词", "ér", "连词表修饰，前词表方式状态，后词表动作", "表修饰，连接状语和中心语", "侃侃～谈", "不可同世而立", "", "表修饰的用法现代汉语仅留存于书面、成语中，日常多用 “地、着” 或直接连接表达修饰关系。", "", false, "频率下降", ""],
            ["自相矛盾", "也", "虚词", "yě", "句末语气助词，表肯定论断，可不译或译为“啊”", "无对应口语字，翻译补语气", "足矣、多矣", "物莫能陷也、弗能应也", "", "文言高频句末助词，表判断、肯定；现代汉语口语不用，仅文言、成语留存", "", false, "受限", ""],
            ["自相矛盾", "以", "虚词", "yǐ", "介词，引进工具，译为“用”", "用、拿", "以刀斩木", "以子之矛", "", "文言介词，引工具、凭借；口语替换为“用”，书面保留用法", "", false, "频率下降", ""],
            ["自相矛盾", "无不", "固定格式", "wú bù", "双重否定副词，译为 \"没有不、全都\"，表示肯定的意思", "现代汉语中仍保留该双重否定结构，用法完全一致", "无不为之感动、无不称赞", "于物无不陷也", "固定格式", "双重否定表肯定的语法功能古今完全一致，现代汉语中仍沿用该结构", "", false, "稳定", "固定格式"],
            ["自相矛盾", "……者", "固定格式", "", "\"者\" 附在名词 / 动词后，指代 \"…… 的人 / 事物\"", "现代汉语中使用\"…… 的人 /…… 的事物\"", "卖盾和矛的人、有学问的人", "楚人有鬻盾与矛者", "固定格式", "“…… 者” 指代 “…… 的人 / 事物”。虽然 “记者”“学者” 等复合词常用，但作为自由构句结构（如 “善游者”），现代口语已用 “…… 的人” 替代。", "现代汉语主要出现在词语“行者、读者、作者、记者”等词语中，作为名词性后缀（构词语素），附着在动词后面，构成名词。", false, "频率下降", "固定格式"],
            ["自相矛盾", "何如", "句式", "", "固定疑问句式，用于询问方法、情况、结果，译为 \"怎么样、如何\"", "现代汉语口语中多用 \"怎么样\" 替代", "你看此事怎么样？、这个方案怎么样？", "以子之矛陷子之盾，何如？", "疑问句", "", "", false, "受限", "疑问句"],
            ["自相矛盾", "“莫”宾语前置", "句式", "", "否定句中代词作宾语，宾语前置，正常语序为 “莫能陷之”", "现代汉语宾语在动词后，语序为 “没有什么能刺穿它”", "没有东西能刺穿它", "物莫能陷也", "倒装句", "古汉语特殊语序规则，否定句里代词宾语要提前，现代汉语无对应规则，翻译时要调整为 “动词 + 宾语” 的正常顺序。", "", false, "受限", "倒装句"],
            ["自相矛盾", "楚", "文化", "Chǔ", "", "", "", "楚人有鬻盾与矛者", "文化", "", "春秋战国时期的诸侯国名称，战国七雄之一，是南方文化的代表，楚辞的发源地。", true, "", "文化"],
            ["自相矛盾", "韩非", "文化", "", "", "", "", "（全文出处）", "文化", "", "《韩非子》是战国末期法家代表人物韩非的哲理散文集，被后人整理而成。\n\n韩非（约公元前 280 年 — 前 233 年），战国末期韩国人，法家代表人物之一，主张以法治国，是先秦法家思想的集大成者，其思想被秦始皇采纳，成为秦朝的治国思想。保存了大量的寓言故事，如《自相矛盾》《守株待兔》等", true, "", "文化"],
            ["自相矛盾", "自相矛盾（成语）", "文化", "zì xiāng máo dùn", "", "", "", "以子之矛，陷子之盾（篇名整体）", "文化", "", "自相矛盾（成语）\n读音：zì xiāng máo dùn\n出处：出自《韩非子・难一》，源自同名寓言故事。\n字面含义：楚国有个卖矛和盾的人，先是夸耀自己的盾坚固无比，任何东西都刺不穿，又吹嘘自己的矛锋利至极，没有什么东西刺不透，旁人反问他 “用你的矛刺你的盾会怎样”，此人顿时无言以对。\n引申义：比喻一个人的言语、言行前后相互抵触，无法自圆其说。\n用法：多作贬义，用来批评言行相悖、逻辑混乱的人或言论。\n例句：他刚才还说从未去过此地，转眼又谈起当地见闻，话语明显自相矛盾。", true, "", "文化"],
            // ===== 画蛇添足 =====
            ["画蛇添足", "画", "实词", "huà", "“画”字像手执毛笔给田地画田界之形。文中指描画、勾勒图形", "沿用描画本义", "画画、画图", "乃左手持卮，右手画蛇", "", "", "", false, "稳定", ""],
            ["画蛇添足", "蛇", "实词", "shé", "名词，无足爬行动物", "词义完全保留，用法不变", "毒蛇、蟒蛇", "请画地为蛇", "古今字", "", "注意：\n古字：它\n本义就是蛇，早期用 “它” 表示蛇。\n假借演变：“它” 被借去作第三人称代词，本义被挤占。\n今字：蛇\n在古字 “它” 基础上加形旁虫，新造 “蛇”，专门承接 “它” 原本的蛇义。", false, "稳定", "古今字"],
            ["画蛇添足", "祠", "实词", "cí", "祭祀", "动词，祭拜先祖", "祠堂、祠庙、祭祀祠祀", "祠者赐舍人卮酒", "", "", "", false, "稳定", ""],
            ["画蛇添足", "赐", "实词", "cì", "尊长赏给晚辈 / 下属财物", "动词，赏赐、赠予", "赏赐、恩赐、赐福", "祠者赐舍人卮酒", "", "义项稳定，主要表示上对下给予，现代 “赐” 多用于书面敬语。", "", false, "稳定", ""],
            ["画蛇添足", "舍", "实词", "shè", "像房屋之形，上像屋顶，中像梁柱，下像基石。本义为房舍。引申为饲养家畜和家禽的房屋。", "居住的房子：宿～。旅～。校～。", "屋舍、校舍", "楚有祠（cí）者，赐其舍（shè）人卮（zhī）酒", "", "", "舍作动词表给予，再由此引申表示以下意义，读作舍shě：\n1.放弃，不要了：～己为人。～近求远。四～五入。\n2.施舍：～粥。～药。", false, "稳定", ""],
            ["画蛇添足", "舍人", "实词", "shè rén", "贵族门下门客、幕僚", "现代无对应身份", "", "祠者赐舍人卮酒", "", "古代贵族专属称谓，现代无对应身份，仅古文历史语境出现。", "战国权贵供养的谋士宾客群体", false, "受限", ""],
            ["画蛇添足", "卮", "实词", "zhī", "古代盛酒器具", "名词，古代酒器", "玉卮、卮酒", "赐舍人卮酒", "", "古代专用酒器，现代生活不再使用，仅文言、文物词汇出现。", "", false, "受限", ""],
            ["画蛇添足", "数", "实词", "shù", "几、几个", "数词，若干", "数个、数人、数日", "数人饮之不足", "多音多义", "", "1. 读 shù（第四声，名词）\n意思：数目、数量、数字；几、几个。\n\n- 数字、数学、人数、次数\n- 数年、数月（几年、几个月）\n\n2. 读 shǔ（第三声，动词）\n意思：点数、计算；比较起来最突出；责备。\n\n- 数一数、数不清、不可胜数\n- 数一数二（最棒）\n- 数落（批评、说缺点）", false, "稳定", "多音多义"],
            ["画蛇添足", "余", "实词", "yú", "剩余", "剩下来的，多出来的：剩～。～粮。～兴。～悸。～孽。节～。～生。", "", "一人饮之有余", "古今字；异词同形；", "“余” 的 “剩余” 义古今完全一致，如 “剩余”“余额”“业余”“其余”。", "注意：\n“余”对应过去两个字。\n一是“余”，“舍”之初文，“余”象以木柱支撑屋顶的房舍，本义是房舍。即“余”为古字，“舍”为今字。另“余”文言文中常假借作第一人称词。现在主要用作姓。\n\n一是剩余的“余”，繁体为“餘”， “餘” 是战国时期出现的形声字，构形为从食、余声，表示“剩余的食物”。由本义引申为剩下来的，多出来的：剩～。～粮。～兴。～悸。～孽。节～。～生。“餘”现代简化后写作“余”，异词同形。", false, "稳定", "古今字；异词同形；"],
            ["画蛇添足", "成", "实词", "chéng", "动词，完成、画好", "本义完整保留，衍生出成功、成为、成果等义", "完成、成功、成长", "一人蛇先成", "", "", "", false, "稳定", ""],
            ["画蛇添足", "引", "实词", "yǐn", "牵拉、拿取，此处指端起（酒器）", "1.拉，伸：～力。～颈。～而不发。～吭高歌。\n2.领，招来：～见。～子。～言。～导。～荐。抛砖～玉。\n3.拿来做证据、凭据或理由：～文。～用。援～。", "", "引酒且饮之", "语义扩大", "引，该字本义是拉弓，文中指“牵拉、拿取”，用于描述\"端起\"这一具体义项现代几乎不用。\n根据“拉过来”这个核心动作特征，引申出带人相见、举荐的引荐义以及引用义，语义扩大。", "“引”古代汉语常用义\n1.本义：拉弓、开弓\n例：引而不发（拉开弓不射箭）\n2.拉、牵、拽（最常用引申）\n例：引车（拉车）、引手（伸手）\n3.拿、取、端（你这句的用法）\n例：引酒（端酒）、引壶觞（拿酒杯）\n4.带领、引导\n例：引兵（带兵）、引入（领进来）\n5.退、退却\n例：秦军引而去（秦军退走）\n6.引用、援引\n例：引经据典", false, "受限", "语义扩大"],
            ["画蛇添足", "夺", "实词", "duó", "强取、抢夺", "动词，强行拿走", "抢夺、争夺、夺取", "夺其卮曰", "", "抢夺核心词义无变化，古今用法统一，书面口语均可使用。", "", false, "稳定", ""],
            ["画蛇添足", "终", "实词", "zhōng", "最终、到头来", "名词，末尾、结局", "最终、终点、至终", "终亡其酒", "", "表结局含义古今一致，搭配词组丰富，适用场景广。", "", false, "稳定", ""],
            ["画蛇添足", "亡", "实词", "wáng", "动词，失去、丢掉", "1. 逃：逃～。流～。\n　2. 失去：～佚。～羊补牢。\n　3. 死：伤～。死～。", "", "终亡其酒", "语义转移", "课文中 “亡” 是 “失去、丢掉” 的意思，该义保留在 “亡羊补牢” 中。现代常用义是 “死亡 / 灭亡”，词义中心已转移。", "", false, "受限", "语义转移"],
            ["画蛇添足", "且", "虚词", "qiě", "副词，将要、准备", "1、表示将要、将近：城～拔矣。年～九十。\n2. 尚，还，表示进一层：既高～大。尚～。况～。\n3. 表示暂时：苟～偷安。姑～。", "", "引酒且饮之", "", "课文中 “且” 是 “将要” 的意思。现代 “且”语义转移， 最常用作连词 “而且 / 并且”，“将要” 义只在古文中出现。", "", false, "受限", ""],
            ["画蛇添足", "固", "虚词", "gù", "副词，本来、原本", "1.结实，牢靠：坚～。稳～。巩～。凝～。加～。\n2.坚定，不变动：～执。～定。～本。\n3.本，原来：～有。～步自封（亦作“故步自封”）", "", "蛇固无足", "", "本义为本来，语义保留，后拓展出形容质地如“坚固”、性格的义项如“固执”，语义转移。\"副词'本来'义频率下降。", "", false, "频率下降", ""],
            ["画蛇添足", "之", "虚词", "zhī", "代词，代指前文提到的人或事物", "之 - 01 口语用 \"它\"，书面 / 文言保留该代词用法", "取之不尽、用之不竭", "数人饮之（指酒）不足，一人饮之（指酒）有余；引酒且饮之（指酒）；吾能为之（指蛇）足；子安能为之（指蛇）足", "", "之作代词相当于\"它\"，口语用\"它/他\"替代，书面语和成语中保留（如\"取而代之\"）。", "", false, "频率下降", ""],
            ["画蛇添足", "之", "虚词", "zhī", "结构助词，译为 \"的\"", "之 - 02 现代通用助词 \"的\" 承担相同功能，书面语仍沿用 \"之\"", "祖国之山河、友人之书信", "未成，一人之蛇成", "", "\"之\"作结构助词相当于\"的\"，口语用\"的\"，书面语保留（如\"成功之路\"）", "", false, "频率下降", ""],
            ["画蛇添足", "其", "虚词", "qí", "第三人称物主代词，他的、它的、他们的", "他的、那个", "其人、其家", "终亡其酒、夺其卮", "", "文言物主代词，代指他人事物；口语用“他的”，书面单用“其”", "", false, "频率下降", ""],
            ["画蛇添足", "为", "虚词", "wèi", "介词，译为“给、替”", "给、替", "为人民服务、为他作画", "吾能为之足", "", "文言多音多义虚词，读wèi表动作对象，意为替、给；现代汉语仍保留。", "为（wéi /wèi）\n\nwéi（阳平）：动词，表 “做、是、成为” 等实义，上古常用。\nwèi（去声）：介词，表 “替、为了、因为”，由 wéi 变调分化而来。", false, "稳定", ""],
            ["画蛇添足", "……者", "固定格式", "", "\"者\" 附在名词 / 动词后，指代 \"…… 的人 / 事物\"", "现代汉语仍沿用该结构，用法一致", "行者、读者、作者、记者", "楚有祠(ci)者/为蛇足者，终亡其酒", "固定格式", "\"……者\"指代\"……的人/事物\"（如\"画蛇者\"=画蛇的人）。现代口语已用\"……的人/事物\"替代，书面正式语境偶见。现代汉语主要出现在词语“行者、读者、作者、记者”等词语中，作为名词性后缀（构词语素），附着在动词后面，构成名词。", "", false, "频率下降", "固定格式"],
            ["画蛇添足", "安能", "固定格式", "ān néng", "固定疑问短语，怎么能", "现代书面语仍沿用，口语多用 \"怎么能\" 替代", "安能如此、安能放弃", "安能为之足？", "固定格式", "“安能” 相当于 “怎么能”，现代口语不用，仅见于文言引用。", "", false, "受限", "固定格式"],
            ["画蛇添足", "《战国策》", "文化", "", "", "", "", "", "文化", "", "先秦经典历史典籍，文史研究常用书目，简称《国策》，分国记事的历史散文著作；全书共 33 卷，分为东周、西周、秦、齐、楚、赵、魏、韩、燕、宋、卫、中山十二策", true, "", "文化"],
            ["画蛇添足", "寓言故事与成语：画蛇添足", "文化", "", "", "", "", "", "文化", "", "本篇寓言讲述众人比赛画蛇，一人画完后多此一举给蛇添上脚，最终失去酒的故事；成语寓意：做了多余的事，非但无益，反而坏事", true, "", "文化"],
            // ===== 执长竿入城 =====
            ["执长竿入城", "执", "实词", "zhí", "拿着、握着", "1.动词，握持、拿着：～刃。～鞭。～笔。\n2.动词，执行、依照规定行事：执法以严，违法必究\n3.动词，坚持、执意：他执意要走\n4.动词，主管、掌管：老国王执政期间，天下太平", "", "鲁有执长竿入城门者/初竖执之", "语义扩大", "“执” 的 “握 / 拿” 义仍常用。", "注意：本义为拘捕，引申出握持物体的含义，语义扩大；\n文中表示“握、持、拿”，该语义保留在现代汉语中，后词义范围拓展，语义转移，引申出“执行、坚持、主管”等义。", false, "稳定", "语义扩大"],
            ["执长竿入城", "鲁", "实词", "Lǔ", "鲁国，中国古代诸侯国名", "1.愚拙，蠢笨：愚～。粗～。～莽。\n2.中国周代诸侯国名，在今山东省西南部。\n3.中国山东省的别称。\n4.姓。", "", "鲁有执长竿入城门者", "", "“鲁” 在古代常用来指诸侯国，现代汉语里不再作为国名使用，只保留在地名、姓氏和固定文化词语中，日常口语很少单独使用。", "先秦诸侯国名，疆域在今山东一带，是儒家文化的发源地。", false, "频率下降", ""],
            ["执长竿入城", "初", "实词", "chū", "名词/副词，开始、起初、原来", "名词/副词，开始、最初、原先", "起初、初始、年初", "初竖执之", "语义转移", "“初” 的 “开始 / 最初” 义稳定保留，如 “初次”“最初”“初学者”。", "注意：“初”甲骨文会意字，本义为用刀裁衣（表起始），后引申泛指一切事物的开端、原本状态，属于语义转移。", false, "稳定", "语义转移"],
            ["执长竿入城", "竖", "实词", "shù", "竖着，与地面垂直，与 “横” 相对", "形容词，与地面垂直的；也可作动词", "竖立、竖线、竖直、竖起来", "初竖执之", "", "", "", false, "稳定", ""],
            ["执长竿入城", "横", "实词", "héng", "横着，与地面平行，与 “竖” 相对", "形容词，与地面平行的；也可作名词、动词", "横线、横向、纵横交错", "横执之", "多音多义", "", "“横” 有两个读音：héng 和 hèng\n• 横 héng（二声）：主要指方向、位置，跟 “竖、直” 相反，是左右或东西方向。\n例：横梁、横幅、横写、纵横、汉字 “一” 这个笔画也叫 “横”。\n• 横 hèng（四声）：主要指性格、运气，一是蛮横、不讲理；二是意外、突然。\n例：蛮横、强横、横财（意外之财）、横祸（意外的灾祸）。", false, "稳定", "多音多义"],
            ["执长竿入城", "计", "实词", "jì", "计策、办法", "名词，办法、策略；也可作动词", "计策、计划、计谋、千方百计", "计无所出", "", "", "", false, "稳定", ""],
            ["执长竿入城", "老父", "实词", "lǎo fǔ", "对老年男子的尊称，相当于 “老大爷”", "对老年男性的尊称，现代已不常用", "", "俄有老父至", "", "古代用 “老父” 尊称老年男子，现代汉语里不再这么称呼，日常说“爷爷” “大爷”“老先生”，这个词只在古文、旧小说里出现。", "", false, "受限", ""],
            ["执长竿入城", "圣人", "实词", "shèng rén", "古代指品德最高尚、智慧最高超的人", "名词，指品德智慧极高的人；也可指某领域造诣极高的人", "至圣先师、诗圣、书圣", "吾非圣人", "", "古代 “圣人” 是对贤人的最高称呼，现代汉语里不再日常使用，只在谈论古代文化、历史人物的时候用到，语义范围也有所缩小。", "儒家常称孔子为圣人，后世也把某领域顶尖人物称为 “圣”，如 “诗圣杜甫”。", false, "受限", ""],
            ["执长竿入城", "锯", "实词", "jù", "锯子，用来拉开木料等的工具", "名词，切割工具；也可作动词", "电锯、钢锯、锯木头、拉锯战", "何不以锯中截而入", "", "", "", false, "稳定", ""],

            ["执长竿入城", "依", "实词", "yī", "依照、听从", "动词，按照、听从、依靠", "依照、依据、依靠、依计行事", "遂依而截之", "", "", "", false, "稳定", ""],
            ["执长竿入城", "而", "虚词", "ér", "连词，表承接，连接先后发生的动作，译为\"就、然后\"", "而-01 连词承接用法沿用至今", "取而代之、择善而从", "遂依而截之", "", "“而” 作承接连词（然后 / 就），书面语保留，口语多用 “然后”“就”。", "", false, "频率下降", ""],
            ["执长竿入城", "而", "虚词", "ér", "连词表修饰，前词表方式状态，后词表动作", "而-02 连词修饰用法沿用至今", "缓步而行、席地而坐、侃侃而谈", "何不以锯中截而入", "", "“而” 作修饰连词，连接方式与动作，书面语保留，口语不单独使用。", "", false, "频率下降", ""],
            ["执长竿入城", "亦", "虚词", "yì", "副词，翻译为“也”", "副词，也、也是", "反之亦然、人云亦云、亦或、亦无不可", "横执之，亦不可入", "", "“亦” 的 “也” 这个意思本身没有变化，但现代汉语口语里普遍说 “也”，“亦” 只保留在成语、书面语中，日常说话很少使用。", "", false, "频率下降", ""],
            ["执长竿入城", "俄", "虚词", "é", "不久、一会儿，很短时间", "现代多用“一会儿”", "", "俄有老父至", "", "古代 “俄” 常用来表示时间很短，现代汉语里已经不单独使用了，只在非常书面的文言风格表达里能见到，日常都用 “一会儿”“不久”。", "常见搭配 “俄而”“俄顷”，都是表示时间很短的文言词语。", false, "受限", ""],
            ["执长竿入城", "非", "虚词", "fēi", "不是", "副词，不、不是", "非常、非卖品、答非所问、无可非议", "吾非圣人", "", "“非” 表示否定的核心意思保留了，“非” 大多用在词语、成语和正式书面语里，不单独作谓语。", "", false, "稳定", ""],
            ["执长竿入城", "但", "虚词", "dàn", "仅、只是", "1.只，仅，只是：～愿如此。～凡（凡是，只要是）。～分（只要）。\n2.不过，可是：工作虽辛苦，～没有叫苦的。", "", "但见事多矣", "", "古代 “但” 主要作副词表示 “只、仅仅”，现在这个意思使用频率下降。现代汉语里 “但” 最常用作转折连词 “但是”，核心用法发生了转移。", "", false, "频率下降", ""],
            ["执长竿入城", "矣", "虚词", "yǐ", "用在句末，相当于 “了”", "句末语气助词，仅见于文言、书面语", "悔之晚矣、由来久矣、足矣", "但见事多矣", "", "古代 “矣” 是很常用的句末语气词，表示事情已经完成或肯定的语气。现代汉语里基本不用这个字，只在成语、文言引用里能见到，日常都用 “了”。", "", false, "受限", ""],
            ["执长竿入城", "之", "虚词", "zhī", "代词，代指前文提到的人或事物", "它、它（代事物）", "取之不尽、弃之不顾", "初竖执之、横执之、遂依而截之", "", "文言高频代词，可代人、物、事；现代汉语口语用“它/他/她”，“之”仅存书面、成语", "", false, "频率下降", ""],
            ["执长竿入城", "以", "虚词", "yǐ", "介词，引进工具，译为“用”", "用、拿", "以刀割之、以手示意", "何不以锯中截而入", "", "文言常用介词，可引工具、凭借、原因；口语多用“用、拿”替代，书面保留", "", false, "频率下降", ""],
            ["执长竿入城", "……者", "固定格式", "", "\"者\" 附在名词 / 动词后，指代 \"…… 的人 / 事物\"", "现代汉语仍沿用该结构，用法不变，\"……的人\"", "\"……的人\"", "鲁有执长竿入城门者", "固定格式", "\"……者\"指代\"……的人\"（如\"执竿者\"=拿长竿的人）。现代口语已用\"……的人\"替代，书面正式语境偶见。", "", false, "频率下降", "固定格式"],
            ["执长竿入城", "有……者", "固定格式", "/", "文言固定格式，表示存在、引出陈述对象，可译为“有……的人、有……的”", "现代：有……的人", "有读书的人、有路过的人", "鲁有执长竿入城门者", "固定格式", "上古经典指代句式，文言高频用来引出人物；现代汉语改用“有……的人”，古句式基本不用", "", false, "受限", "固定格式"],
            ["执长竿入城", "无所+动词 固定短语格式", "固定格式", "", "\"无所+动词\"经典组合格式，表\"没有可……的\"", "用法沿用至今", "无所畏惧、无所不谈", "计无所出", "固定格式", "“无所 + 动词” 结构沿用至今，如 “无所不知”“无所作为”“无所适从”。", "", false, "稳定", "固定格式"],
            ["执长竿入城", "何不……？", "句式", "", "固定句式，译为\"为什么不……？\"，用来提出建议", "现代口语多用\"为什么不……？\"个别语境下正常使用该句式", "何不结伴同行？", "何不以锯中截而入", "反问句", "“何不” 相当于 “为什么不……”，现代口语用 “为什么不”，书面偶见 “何不”。", "", false, "频率下降", "反问句"],
            ["执长竿入城", "《笑林》", "文化", "", "", "", "", "《执长竿入城》出处", "文化", "", "中国最早的笑话集。邯郸淳（约132-221），《笑林》编撰人又名竺，字子叔，东汉末年颍川人，东汉知名文人。本文《持长竿入城》选自此书；古代笑话特点：短小精悍、语言精炼、寓意深刻", true, "", "文化"],
            ["执长竿入城", "执长竿入城（成语/典故）", "文化", "", "", "", "", "", "文化", "", "《执长竿入城》这则古代笑话讲述鲁人持长竿入城，横竖皆无法进入，又听信老者盲目截断竹竿的荒唐建议，最终损毁竹竿的故事，讽刺了思维僵化、不懂灵活变通的人，同时也批评了那些倚老卖老、自作聪明、胡乱出主意的人，告诫人们遇事要独立思考、多方尝试，切莫盲从他人、墨守成规。", true, "", "文化"],
            // ===== 火烧裳尾 =====
            ["火烧裳尾", "裳", "实词", "cháng", "名词，古代指下衣、裙子，此处泛指衣服的下摆", "裳-01 名词，现多用于书面语，泛指衣裳、衣服", "衣裳、霓裳羽衣", "见人裳尾为火所烧", "语义扩大；多音多义", "古义专指下衣，后词义扩大泛指全身衣服，读作“shang”，口语中多与\"衣\"连用。古义下衣专指已消退。", "裳（cháng /shang）\n\n1. cháng\n古义：下衣、裙子（男女通用），与上衣 “衣” 相对。\n例：霓裳、云裳、绿衣黄裳、泪沾裳。\n2. shang（轻声，今读）\n仅用于口语词，衣裳，泛指 “衣服”。\n例：买衣裳、穿衣裳。", false, "受限", "语义扩大；多音多义"],
            ["火烧裳尾", "尾", "实词", "wěi", "衣裙的下摆，末端部分", "名词，动物身体末端；事物的末端", "尾巴、结尾、末尾、车尾", "见人裳尾为火所烧", "", "", "", false, "稳定", ""],
            ["火烧裳尾", "性", "实词", "xìng", "性子、性格", "名词，性格、本性；事物的属性", "性格、性子、品性、天性", "恐君性急", "", "", "", false, "稳定", ""],
            ["火烧裳尾", "宽缓", "实词", "kuān huǎn", "形容词，形容人性格迟缓、慢性子", "宽： 心胸大度：宽容、宽厚\n\n缓：速度慢、不急：缓慢、迟缓", "", "有人性宽缓", "", "古义可二字连用形容性格；现代汉语不再组合使用，拆为 \"宽厚\"\" 缓慢 \" 等独立词语", "", false, "受限", ""],
            ["火烧裳尾", "冬日", "实词", "dōng rì", "冬天", "名词，冬天、冬季", "冬日暖阳、冬日进补", "冬日共人围炉", "", "古代说 “冬日” 表示冬天，现代汉语里日常都说 “冬天”“冬季”，“冬日” 只在书面、文学性的表达里使用，口语很少说。", "", false, "频率下降", ""],
            ["火烧裳尾", "围", "实词", "wéi", "围绕、环绕", "动词，环绕、包围；也可作名词", "包围、围绕、围巾、围坐", "冬日共人围炉", "", "现代汉语里依然是常用词，使用场景非常多。", "", false, "稳定", ""],
            ["火烧裳尾", "炉", "实词", "lú", "炉子，取暖做饭的器具", "名词，加热、取暖的器具", "火炉、电炉、锅炉、壁炉", "冬日共人围炉", "", "“炉” 表示取暖加热器具的含义一直保留到现在，虽然具体样式变了，但核心意思没变，现代汉语依然常用。", "", false, "稳定", ""],
            ["火烧裳尾", "言", "实词", "yán", "说、告诉", "1.讲，说：～说。～喻。～道。～欢。～情。～必有中（zhòng ）（一说就说到点子上）。\n2.说的话：～论。～辞（亦作“言词”）。语～。～语。～简意赅。", "", "欲言之", "语义转移", "古代 “言” 作动词表示 “说” 很常用，现代汉语里这个用法只留在成语、书面语里，日常口语都说 “说”“讲”。“言” 更多作名词用。从动词\"说\"→名词\"说的话\"，词性改变，语义重心从动作转移到动作的结果/内容。", "", false, "频率下降", "语义转移"],
            ["火烧裳尾", "君", "实词", "jūn", "古代对对方的尊称，相当于 “您”", "现代汉语里日常对话都用 “您”", "", "恐君性急", "", "古代 “君” 是很常用的第二人称尊称，现代汉语里日常对话都用 “您”，“君” 只在书面、正式场合或者成语里出现，口语基本不用。", "古代也指君主、国君，是一词多义。", false, "受限", ""],
            ["火烧裳尾", "伤", "实词", "shāng", "损伤、损坏", "动词，受伤、损害；也可作名词", "受伤、伤害、损伤、伤口", "不遂我伤乎", "", "现代汉语里依然是常用词，使用范围还很广。", "", false, "稳定", ""],
            ["火烧裳尾", "恐", "实词", "kǒng", "动词，担心、害怕", "1.担心，害怕，畏惧：～惧。～怖。～慌。惊～。有恃无～。\n2.恫吓（hè）：～吓（hè）。\n3.副词，恐怕（表推测）：～怕。～不能成功、。", "", "欲言之，恐君性急", "", "本义为害怕，后引申出副词用法表推测。", "", false, "稳定", ""],
            ["火烧裳尾", "是", "实词", "shì", "形容词，对、正确", "是-01 形容词，对、正确", "一无～处、自以为～、～非。他说的～。实事求～。", "然则言之是耶", "", "后引申出判断动词用法，成为现代汉语核心义项，词义范围扩大。", "", false, "频率下降", ""],
            ["火烧裳尾", "道", "实词", "dào", "说、讲", "动词，说", "说道、道谢、一语道破", "何遽为道我耶", "语义转移", "古代 “道” 作动词表示 “说” 很常见，现在这个用法只留在 “说道”“道谢” 等少量词语里。现代汉语里 “道” 最常用作名词，表示道路、道理，核心词性和词义中心都转移了。", "", false, "频率下降", "语义转移"],
            ["火烧裳尾", "共", "虚词", "gòng", "共同、一起", "副词，一起、共同", "共同、共享、一共、同舟共济", "冬日共人围炉", "", "“共” 表示一起的核心含义，现代汉语里依然非常常用，还发展出了 “总共”“公共” 等义项。", "", false, "稳定", ""],
            ["火烧裳尾", "是", "虚词", "shì", "代词，这样、如此", "代词，这样、如此", "是日天气晴朗、如是", "其人曰：\"我言君性急，果是。\"", "", "“是” 作代词 “这样 / 如此”，现代口语不用，仅在古文和书面语中出现。", "", false, "受限", ""],
            ["火烧裳尾", "耶", "虚词", "yé", "用在句末，表示疑问、反问语气，相当于 “呢”“吗”", "现代汉语里完全不用这个字作语气词了，日常都用 “吗”“呢”", "", "然则言之是耶", "", "古代 “耶” 是很常用的疑问语气词，现代汉语里完全不用这个字作语气词了，日常都用 “吗”“呢”，只在古文引用里能见到。", "", false, "受限", ""],
            ["火烧裳尾", "何", "虚词", "hé", "为什么、怎么，表疑问", "疑问代词，什么、为什么", "为何、何必、如何、何去何从", "何遽为道我耶", "", "“何” 表示疑问的核心意思保留了，但现代汉语口语里更常用 “什么”“怎么”，“何” 大多用在词语、成语和正式书面语里，很少单独用在口语对话里。", "", false, "频率下降", ""],
            ["火烧裳尾", "果", "虚词", "guǒ", "果然、果真", "副词，果然", "果然、果真、果不其然", "果是", "", "“果” 表示 “果然” 的副词含义从古到今都保留着，现代汉语里依然常用，同时它的名词 “果实” 义也很常用。", "", false, "稳定", ""],
            ["火烧裳尾", "之", "虚词", "zhī", "代词，代指前文提到的人或事物", "它、这件事", "言之有理、付之行动", "欲言之、不言之", "", "文言通用代词，可代人、事、物；现代汉语口语用“它、这件事”，“之”仅留存书面、成语", "", false, "频率下降", ""],
            ["火烧裳尾", "矣", "虚词", "yǐ", "句末语气助词，表事情已然完成，译为“了”", "了", "大势去矣、悔之晚矣", "裳尾已尽矣", "", "文言专用已然语气词；现代汉语口语完全不用，仅成语、古文引用可见，日常替换为“了”", "", false, "受限", ""],
            ["火烧裳尾", "乎", "虚词", "hū", "句末语气词，表反问，译为“吗”", "吗、呢", "得无……乎", "不遂我伤乎", "", "文言专用反问语气词，现代汉语口语不用，仅古文、书面议论文使用", "", false, "受限", ""],
            ["火烧裳尾", "为", "虚词", "wèi", "介词，替、给", "替、给", "为他人辩解", "何遽为道我耶", "多音多义", "读wèi表动作对象；区分wéi动词/被动标记（为……所）", "为（wéi /wèi）\n\nwéi（阳平）：动词，表 “做、是、成为” 等实义，上古常用。\nwèi（去声）：介词，表 “替、为了、因为”，由 wéi 变调分化而来。", false, "频率下降", "多音多义"],
            ["火烧裳尾", "然则", "固定格式", "rán zé", "既然这样，那么……", "连词，承接上文引出结论，多用于书面语", "然则如此、然则奈何", "然则言之是耶", "固定格式", "“然则” 是文言里常用的承接词组，用来顺承上文引出推论。现代汉语里基本不单独用这个词，日常都说 “既然这样，那么……”，只在非常书面的语境里偶尔出现。", "", false, "受限", "固定格式"],
            ["火烧裳尾", "为……所……", "句式", "wéi……suǒ……", "文言固定被动句式，译为\"被……\"，表示主语受动作支配", "现代汉语仍广泛使用该被动结构，表被动含义", "为生活所迫、为大自然所陶醉、为人们所重视", "见人裳尾为火所烧", "被动句", "“为…… 所……” 被动结构在现代书面语中仍使用（如 “为人所知”“为世人所称道”），口语中用 “被” 字句。", "", false, "频率下降", "被动句"],
            ["火烧裳尾", "《火烧裳尾》", "文化", "", "", "", "", "", "文化", "", "寓言通过慢性子的人迟迟不提醒他人衣服着火，最终引发对方大怒的故事，讽刺了做事迂腐、不分轻重缓急的慢性子人。成为形容人做事拖沓、不分场合、不知变通的经典典故。告诫我们遇事要灵活变通，不能像《火烧裳尾》里的人一样迂腐死板。", true, "", "文化"],
            // ===== 远水不救近火 =====
            ["远水不救近火", "使", "实词", "shǐ", "动词，叫、让，指使他人做某事", "使-01 动词，使、让；现代主语为人时多改用\"叫、让\"", "这部电影使观众很感动；老师让我通知大家", "鲁穆公使众公子或宦于晋，或宦于荆", "", "文言中通用\"使\"表指使，现代汉语使用场景收窄，人称主语下多替换为\"叫、让\"", "", false, "稳定", ""],
            ["远水不救近火", "众", "实词", "zhòng", "1.形容词，很多、众多", "1.形容词，数量多：人口众多、敌众我寡、众人拾柴火焰高\n\n2.名词，许多人：观众、听众、众目睽睽", "", "鲁穆公使众公子或宦于晋", "", "本义为多人，后衍生出形容词用法“很多”，语义扩大", "", false, "稳定", ""],
            ["远水不救近火", "公子", "实词", "gōng zǐ", "指诸侯的儿子，具体到课文中，就是鲁国君主（鲁穆公）的儿子们，属于先秦贵族的特定称谓，是诸侯之子的专称。", "公子-01 沿用古义，现多用来尊称他人的孩子，也用于\"公子哥儿\"指不学无术的年轻人", "公子哥儿", "鲁穆公使众公子或宦于晋", "语义扩大", "先秦“公子”专指诸侯之子，后来扩大到泛指公卿、士族乃至普通年轻男子，指称对象变多，语义扩大；\n同时，后还衍生出“公子哥儿”这类贬义用法，语义转移。", "先秦：诸侯之子；汉至唐：公卿之子；北宋后：豪门士族青年男子；近现代：尊称年轻男子，也用于\"公子哥儿\"指不学无术的年轻人", false, "受限", "语义扩大"],
            ["远水不救近火", "宦", "实词", "huàn", "动词，做官、任职", "宦 - 01 动词，出外做官、供职", "宦游四方、仕宦之家", "鲁穆公使众公子或宦于晋", "", "“宦” 的 “做官” 义没有变化，但现代口语不用，仅见于 “宦官”“宦海” 等书面词语。", "", false, "频率下降", ""],
            ["远水不救近火", "假", "实词", "jiǎ", "动词，借、借助", "书面/成语中保留\"借\"义", "1.假公济私：借着公家的名义或便利，谋取个人私利。2.狐假虎威：狐狸借助老虎的威风吓唬百兽。\n3.假手于人：借助别人的手来做事，依靠他人办事。\n4.不假思索：不用借助思考，形容反应很快。", "假人于越而救溺子", "语义转移", "古以\"借\"为常用义，今\"虚假\"成为核心义，本义主要留存于固定成语", "", false, "频率下降", "语义转移"],
            ["远水不救近火", "善", "实词", "shàn", "擅长、善于", "1.心地仁爱，品质淳厚：～良。～心。～举。～事。～人。～男信女。慈～。\n2.好的行为、品质：行～。惩恶扬～。\n3.擅长，长（cháng ）于：～辞令。多谋～断。", "", "越人善游", "语义转移", "“善” 表示 “做得好、擅长” 的含义使用频率下降，现代汉语里常用“善良” 的形容词义，语义转移。", "", false, "频率下降", "语义转移"],
            ["远水不救近火", "生", "实词", "shēng", "活、存活", "动词，生存、活着；也可作名词、形容词", "生存、生活、生死、生龙活虎", "子生，寡人必善遇子", "", "“生” 表示 “活着” 的核心含义一直保留到现在，现代汉语里依然是核心常用字，还发展出了 “出生”“产生” 等非常多义项。", "", false, "稳定", ""],
            ["远水不救近火", "溺", "实词", "nì", "动词，溺水、淹没", "动词，溺水、沉迷", "溺水、沉溺", "假人于越而救溺子", "", "", "", false, "稳定", ""],
            ["远水不救近火", "失", "实词", "shī", "动词，发生意外、遭遇灾祸", "发生意外", "失火、飞机失事", "失火而取水于海", "", "“失” 的 “遭遇意外” 义仍常用（如 “失事”“失火”），同时扩展出 “遗失”“失败”“失误” 等义。", "", false, "稳定", ""],
            ["远水不救近火", "今", "实词", "jīn", "现今、现在", "名词，现在、当下", "今天、如今、至今、今朝", "今晋与荆虽强", "", "“今” 表示现在的核心含义一直保留到现在，现代汉语里依然常用。", "", false, "稳定", ""],
            ["远水不救近火", "患", "实词", "huàn", "担忧", "1.忧虑：～得～失。忧～。\n2.灾祸：～难。祸～。隐～。防～未然。\n3.害病：～病。～者。", "", "鲁患其不救乎", "语义转移", "“患” 的 “担忧” 义使用频率相比古代汉语有所下降，常用（如 “忧患”“患得患失”），现代“患病” 义更常用，语义转移。", "", false, "频率下降", "语义转移"],
            ["远水不救近火", "于", "虚词", "yú", "介词，在、从；古句式：动词+于+宾语", "介词，在、从；现代语序：在/从+宾语+动词", "我生于四川内江", "或宦于晋、或宦于荆、假人于越、取水于海", "", "“于” 作介词（在 / 从）书面语中常见（如 “关于”“对于”“属于”），但口语不单独使用 “于”。", "", false, "频率下降", ""],
            ["远水不救近火", "虽", "虚词", "suī", "让步连词，虽然、即使", "连词，表让步转折", "虽然、虽说、虽则、虽败犹荣", "今晋与荆虽强", "", "“虽” 表示让步转折的核心含义从古到今都没变，现代汉语里依然常用，多组成 “虽然”“虽说” 等合成词使用。", "文言高频让步连词，常与 “必”“而” 搭配。", false, "稳定", ""],
            ["远水不救近火", "必", "实词", "bì", "一定、必定", "副词，肯定、一定", "必须、必定、必然、务必", "虽溺必不救矣", "", "“必” 表示肯定、一定的意思从古到京都没有变化，现代汉语里依然是非常常用的副词，使用场景很多。", "", false, "稳定", ""],
            ["远水不救近火", "乎", "虚词", "hū", "句末语气词，相当于 “吗、呢”", "现代汉语里 “乎” 大多组成合成词，不再单独作语气词。", "几乎、似乎、在乎、出乎意料", "不救患乎", "", "古代 “乎” 是很常用的句末语气词，现在这个用法基本不用了，只留在成语和书面语里。现代汉语里 “乎” 大多组成合成词，不再单独作语气词。", "", false, "受限", ""],
            ["远水不救近火", "而", "虚词", "ér", "连词，表承接，连接先后动作", "连词表承接，用法沿用至今", "取而代之、闻风而动", "假人于越而救溺子；失火而取水于海", "", "语法功能古今完全一致，书面语保留", "", false, "频率下降", ""],
            ["远水不救近火", "而", "虚词", "ér", "连词，表转折，译为\"可是、却\"", "连词表转折，用法沿用至今", "华而不实、忙而不乱", "今晋与荆虽强，而齐近", "", "语法功能古今完全一致，书面语保留", "", false, "频率下降", ""],
            ["远水不救近火", "或", "虚词", "huò", "无定代词，有的（人）", "1.副词，或许、或者：或许会下雨、或者你先走。\n2.有时：或早或晚、\n或多或少。", "", "鲁穆公使众公子或宦于晋，或宦于荆", "", "1. 文中两个 \"或\" 对应：有的公子去晋国做官，有的去楚国做官 2. 古今对比：古文 \"或\" 多指人，现代基本不用；现代 \"或\" 常表选择。", "", false, "受限", ""],
            ["远水不救近火", "矣", "虚词", "yǐ", "句末语气助词，表肯定、已然，译为“了”", "了", "事已毕矣", "必不救矣、必不灭矣", "", "同《执长竿入城》《火烧裳尾》“矣”用法互通", "", false, "受限", ""],
            ["远水不救近火", "与", "虚词", "yǔ", "并列连词，和、同", "和、跟", "我与你同行", "今晋与荆虽强", "", "文言并列连词，现代口语多用“和”，书面少量保留“与”", "", false, "频率下降", ""],
            ["远水不救近火", "其", "虚词", "qí", "第三人称物主代词，他的、它的、他们的", "它、这件事", "其势危急", "鲁患其不救乎", "", "文言可代事、代人、代物，口语拆分“它/他的”", "", false, "频率下降", ""],
            ["远水不救近火", "虽……必……", "句式", "", "固定让步推论句式，“虽” 表假设让步，译为 “即使”；“必” 表肯定推断，译为 “一定”；整体结构为 “即使……，也一定……”", "现代汉语中不再用 “虽…… 必……”，一般用 “即使…… 也……”“就算…… 也……” 来表达相同逻辑", "即使他跑得再快，也赶不上这班火车；就算准备得再充分，也难免会紧张", "越人虽善游，子必不生矣；海水虽多，火必不灭矣", "让步句式", "上古汉语 “虽” 有两种用法：\n1. 事实让步（陈述已存事实）→ 译 “虽然”；\n2. 假设让步（虚拟举例、打比方）→ 译 “即使 / 就算”。\n本课两句是虚拟假设，属于假设让步，故译 “即使”。“必” 在文言中表必然推断，现代汉语中多由 “也” 承接转折，不再用 “必” 搭配 “虽”。", "", false, "受限", "让步句式"],
            ["远水不救近火", "状语后置（于字结构）", "句式", "/", "状语后置，介词结构（于 + 宾语）后置于动词", "现代状语多前置", "（古）宦于晋 ←（今）在晋国做官", "鲁穆公使众公子或宦于晋", "倒装句", "状语后置是古代汉语特有的语序，现代汉语中状语放在动词前面。", "", false, "受限", "倒装句"],
            ["远水不救近火", "鲁穆公", "文化", "Lǔ Mù gōng", "鲁国的国君，春秋时期鲁国君主", "", "", "鲁穆公使众公子宦于晋", "文化", "", "古代诸侯国君主的称号，姬姓，名显，战国初期鲁国第 29 任君主。", true, "", "文化"],
            ["远水不救近火", "晋", "文化", "Jìn", "晋国，中国古代诸侯国名", "", "", "宦于晋", "文化", "", "春秋五霸之一，疆域主要在今山西省一带。古代指诸侯国，现在作为山西的简称保留，也用于历史朝代名称，日常不会单独用 “晋” 指国家。", true, "", "文化"],
            ["远水不救近火", "荆", "文化", "Jīng", "楚国的别称，古代诸侯国名", "", "", "假道于荆", "文化", "", "楚人本居住在荆山一带，故又称荆楚。古代是楚国的别称，现在只保留在地名、文化词语里，日常不再作为国名使用。", true, "", "文化"],
            ["远水不救近火", "犁钽", "文化", "Lí Jū", "人名，战国时期人物", "", "", "犁钽曰", "文化", "", "也作 “犁且”，齐国谋士，《战国策》中有记载。", true, "", "文化"],
            ["远水不救近火", "越", "文化", "Yuè", "越国，中国古代诸侯国名", "", "", "越人善游", "文化", "", "春秋末期越王勾践曾称霸，疆域在今浙江一带。古代指诸侯国，现在作为浙江地区的古称保留，也用于地名、文化名词，日常不会单独指国家。", true, "", "文化"],
            ["远水不救近火", "齐", "文化", "Qí", "齐国，中国古代诸侯国名", "", "", "齐近鲁", "文化", "", "春秋五霸之首，疆域主要在今山东的北部。古代指诸侯国，现在作为山东地区的代称保留在文化词语里，日常不再作为国名使用。", true, "", "文化"],
            ["远水不救近火", "远水不救近火（俗语）", "文化", "", "", "", "", "失火而取水于海，海水虽多，火必不灭矣", "文化", "", "这则俗语（寓言）通过 “越人善游难救落水子、海水再多难灭近火” 的比喻，点明了远处的帮助解决不了眼前的急迫需要，文中体现了高超的沟通和劝谏艺术，讽刺了不切实际、舍近求远的做法。", true, "", "文化"],
            // ===== 拔杨容易栽杨难 =====
            ["拔杨容易栽杨难", "杨", "实词", "yáng", "杨树，一种树木", "名词，杨树；也作姓氏", "杨树、白杨、杨柳、杨木", "夫杨，横树之即生", "", "“杨” 表示杨树的意思从古到今都没有变化，现代汉语里依然是常用的树木名称，也常用作姓氏。", "古代常指白杨，是北方常见的速生树种。", false, "稳定", ""],
            ["拔杨容易栽杨难", "栽", "实词", "zāi", "栽种、栽植", "动词，种植、插上", "栽种、栽树、栽培、盆栽", "至十仞之树", "", "", "", false, "稳定", ""],
            ["拔杨容易栽杨难", "贵", "实词", "guì", "本义指“价钱高”，文中指引申义地位高、受君主器重", "1.价钱高，与“贱”相对：～贱（ａ．价格的高低；ｂ．指人的地位高低；ｃ．方言，无论如何）。春雨～如油。\n2.指地位高：～族。～戚。～望（尊贵的门第和声望）。\n3.敬辞，称与对方有关的事物：～国。～庚（请问别人年龄）。～姓。～干（gàn ）（问人要做什么）。\n4.特别好的，重要的：～重（zhòng ）。珍～。尊～。民为～。", "", "陈轸贵于魏王", "", "", "", false, "稳定", ""],
            ["拔杨容易栽杨难", "善", "实词", "shàn", "动词，善待、交好、笼络", "1.心地仁爱，品质淳厚：～良。～心。～举。～事。～人。～男信女。慈～。友～。亲～。和～。\n2.好的行为、品质：行～。惩恶扬～。\n3.好好地：～待。～罢甘休。", "", "子必善左右", "", "", "", false, "稳定", ""],
            ["拔杨容易栽杨难", "事", "实词", "shì", "侍奉、伺候", "自然界和社会中的现象和活动：～情。～件。～业。", "", "子必善事左右", "语义转移", "古代 “事” 作动词表示 “侍奉” 很常用，现在这个用法只留在少数书面词里。现代汉语里 “事” 最常用作名词，表示 “事情”，核心词性和词义中心都转移了。", "", false, "受限", "语义转移"],
            ["拔杨容易栽杨难", "左右", "实词", "zuǒ yòu", "名词，身边近臣、侍从", "1.方位名词，左边和右：左右两边、左右为难\n2.代指身旁的人：左右手（比喻得力的助手\n3.大约：十岁左右", "", "子必善左右", "语义转移", "课文中 “左右” 指身边近臣 / 侍从。现代常用义是方位词 “左边和右边” 或表约数 “十岁左右”，词义已转移。", "", false, "频率下降", "语义转移"],
            ["拔杨容易栽杨难", "树", "实词", "shù", "动词，栽种、种植", "1.木本植物的通称：～木。～林。～大根深（喻势力大，根基牢固）。\n2.种植，培育：～艺（“艺”，种植）。十年～木，百年～人。～荆棘得刺，～桃李得荫。\n3.立，建立：～立。～敌。", "", "横树之即生，倒树之即生", "语义转移", "古以\"栽种\"为常用动词义，现代主流作名词指树木，动词义保留在书面/固定搭配中", "", false, "频率下降", "语义转移"],
            ["拔杨容易栽杨难", "折", "实词", "zhé", "折断、断掉", "动词，断、弄断；也可作形容词", "折断、打折、曲折、折损", "一夫拔之即折", "多音多义", "“折” 表示断开的核心含义从古到今都没变，现代汉语里依然是常用字，还发展出了 “折扣、折合” 等非常多义项。", "1. zhé（二声）：折断、弯曲、折扣（常用义）\n例：折纸、骨折、打折\n2. shé（二声）：断、亏损（口语）\n例：树枝折了、折本\n3. zhē（一声）：翻转、来回摆弄\n例：折腾", false, "稳定", "多音多义"],
            ["拔杨容易栽杨难", "生", "实词", "shēng", "活的、能存活的", "形容词，有生命的、活的", "生动、生鲜、生肉、活生生", "横树之即生", "", "“生” 表示 “活的、有生命的” 这个形容词含义一直保留到现在，现代汉语里依然常用，它的动词、名词义项也都很丰富。", "", false, "稳定", ""],
            ["拔杨容易栽杨难", "使", "实词", "shǐ", "动词，让、派遣、假使", "1.用：～用。～劲。～役。～力。～钱。\n2.派，差谴：～唤。～命。～女。\n3.让，令，叫：迫～。", "", "然使十人树之而一人拔之", "", "核心词义与用法古今基本一致", "", false, "稳定", ""],
            ["拔杨容易栽杨难", "工", "实词", "gōng", "动词/形容词，擅长、善于", "1.细致，精巧：～巧。～整。～笔\n2.善于，长于：～书善画。～于心计。\n3.个人不占有生产资料，依靠工资收入为生的劳动者：～人。～人阶级。", "", "子虽工自树于王", "语义转移", "“工”字，本义是一种有刃的工具，“擅长、善于”义语义保留，现在常表示“工人、工作”等含义", "", false, "频率下降", "语义转移"],
            ["拔杨容易栽杨难", "胜", "实词", "shèng", "动词，抵挡、胜过、战胜", "胜-01 动词，胜利、超过、承受", "", "而不胜一人者", "", "核心词义古今一致，用法延续", "", false, "稳定", ""],
            ["拔杨容易栽杨难", "不胜", "实词", "bù shèng", "承受不了、抵不上；还可表示 “非常、十分”", "动词短语，经受不住、比不上", "不胜酒力、美不胜收、不胜感激", "一人拔之则不胜生矣", "", "古代 “不胜” 是很常用的短语，表示 “受不了、比不上”，现在这个意思只留在成语和书面语里，日常口语都说 “受不了、比不上”。", "", false, "受限", ""],
            ["拔杨容易栽杨难", "去", "实词", "qù", "除去、拔掉、毁掉", "动词，除掉、去掉", "去除、去掉、除去", "毋去其人", "", "", "", false, "稳定", ""],
            ["拔杨容易栽杨难", "王", "实词", "wáng", "国王、君主", "名词，君主、最高统治者", "国王、王子、王朝、王位", "树于王前", "多音多义", "“王” 表示君主的核心含义一直保留到现在，现代汉语里依然常用，还延伸出了 “首领、最厉害的” 等口语义项。", "王（wáng / wàng）\n1. wáng（二声，名词）：君王、国王、首领。例：国王、大王。\n2. wàng（四声，动词）：称王、统治天下。例：王天下、王此大邦\n\n速记：指人读wáng，表动作读wàng", false, "稳定", "多音多义"],

            ["拔杨容易栽杨难", "然", "虚词", "rán", "然而、但是，表转折", "1.对，是：～否。不～。不以为～。\n2.这样，如此：当～。～后。～则。\n3.用于词尾，表示状态：显～。忽～。飘飘～。", "", "然十仞之树", "", "“然” 表示转折的连词含义一直保留到现在，现代汉语里依然常用，多组成 “然而”“虽然” 等合成词使用。", "", false, "稳定", ""],

            ["拔杨容易栽杨难", "则", "虚词", "zé", "那么、就，表承接", "连词，表顺承、因果", "否则、闻过则喜、不进则退", "横树之即生，则生易矣", "", "古代 “则” 是非常高频的承接连词，现在这个用法主要留在成语和书面语里，日常口语都说 “就、那么”，“则” 大多组成合成词使用。", "", false, "频率下降", ""],
            ["拔杨容易栽杨难", "毋", "虚词", "wú", "否定副词，没有、不", "毋-01 仅留存于文言、成语中，口语用\"不、没有\"替代", "少安毋躁", "则毋生杨矣", "", "“毋” 相当于 “不 / 不要”，现代口语不用，仅保留在 “毋庸置疑” 等成语中。", "1.不：最通用，使用范围最广，可否定所有动词、形容词，古今沿用。\n例：不知、不美\n2.非：专门否定判断，译为不是，多搭配名词。\n例：非人也（不是人）\n3.弗：近似 “不”，只否定及物动词，后面一般不带宾语，文言专用。\n例：弗听（不听）\n4.未：否定动作还没发生，译为没有、不曾。\n例：未至（还没到）\n5.勿 / 毋：表劝阻、禁止，译为不要、别，多用于祈使句（劝别人别做）；毋书面文言色彩更重，勿更常用。\n例：勿言（不要说话）、毋妄为（不要乱做）\n\n表普通否定用不；表 “不是” 用非；表 “还没有” 用未；劝人 “不要做” 用勿、毋；文言里不带宾语的否定多用弗。", false, "频率下降", ""],

            ["拔杨容易栽杨难", "……者", "固定格式", "zhě", "\"者\" 附在名词 / 动词后，指代 \"…… 的人 / 事物\"", "助词，指代人或事物；也表停顿", "作者、读者、前者、后者、记者", "不善树之者", "固定格式", "古代 “者” 是非常高频的指代助词，现在这个功能只留在合成词里，日常造句都用 “…… 的人 / 东西” 代替，不再单独自由使用 “者”。", "", false, "频率下降", "固定格式"],
            ["拔杨容易栽杨难", "虽……必……", "句式", "", "虽：事实让步连词，译虽然；必：情态副词，表必然推断，译一定、必定。整句表：虽然具备某种现状，最终必定出现相应结果", "现代汉语改用：虽然…… 但也一定……；", "他虽然能力出众，但也一定会面临挑战", "子虽工自树于王……子必危矣", "让步句式", "“虽……必……”该句式基本仅存在于文言文中", "", false, "受限", "让步句式"],
            ["拔杨容易栽杨难", "…… 者，…… 也", "句式", "", "在这里是说明原因的判断。主语部分表示事情的结果，谓语说明产生这种结果的原因。\n至于用十个人的力量，我种容易活的东西，却抵不上一个人的破坏，是为什么呢?", "现代不使用该结构", "", "至以十人之众，树易生之物，而不胜一人折者，何也？", "判断句", "", "", false, "受限", "判断句"],
            ["拔杨容易栽杨难", "“于”状语后置", "句式", "", "状语后置，介词结构（于 + 宾语）后置于动词", "现代语序：于魏王贵、于王自树", "扬名于四海（现代书面保留倒装）", "陈轸贵于魏王、工自树于王", "倒装句", "", "状语后置是古代汉语特有的语序，现代汉语中状语放在动词前面。", false, "受限", "倒装句"],
            ["拔杨容易栽杨难", "陈轸", "文化", "Chén Zhěn", "人名，战国时期魏国大臣、纵横家", "", "", "陈轸贵于魏王", "文化", "", "战国时期楚国人，历仕秦、楚、魏，以善辩著称。", true, "", "文化"],
            ["拔杨容易栽杨难", "魏王", "文化", "Wèi wáng", "魏国的国王，这里指魏惠王", "", "", "陈轸贵于魏王", "文化", "", "古代诸侯国君主的称呼，即魏惠王，又称梁惠王，战国时期魏国君主，在位时魏国鼎盛。", true, "", "文化"],
            ["拔杨容易栽杨难", "惠子", "文化", "huì zǐ", "", "", "", "", "文化", "", "惠施（约前370—约前310），战国中期宋国人，政治家、思想家、哲学家，名家学派创始人，庄子挚友。\n\n拓展：他认为万物的 “同” 与 “异” 是相对的，没有绝对的界限。\n从 “同” 的角度看，万物都可以找到共性（如 “天地一体”）；\n从 “异” 的角度看，万物又都存在差异（如 “天与地卑，山与泽平”，打破高低贵贱的绝对认知）。\n\n惠子与庄子濠梁之辩：庄子和惠子在濠水的桥上游玩。庄子说：“白鲦鱼在水里游得悠闲自在，这是鱼的快乐啊。”\n惠子反驳：“你不是鱼，怎么知道鱼是快乐的？”\n庄子反问：“你不是我，怎么知道我不知道鱼的快乐？”\n惠子说：“我不是你，固然不知道你；但你本来就不是鱼，你不知道鱼的快乐，这是确定无疑的！”\n庄子说：“让我们回到最初的话题。你问‘你怎么知道鱼快乐’，就说明你已经承认我知道鱼快乐，只是在问我是从哪里知道的 —— 我就是在濠水的桥上知道的呀。”", true, "", "文化"],
            ["拔杨容易栽杨难", "拔杨容易栽杨难", "文化", "", "", "", "", "", "文化", "", "以栽杨、拔杨为喻，点明立身成事艰难、损毁功业容易；劝诫身居高位者要善待身边之人，提防他人构陷，警醒身处险境。同时，它既可以指事业、基业的建设，也可以指品德、信任的养成，提醒我们要懂得珍惜成果、防微杜渐，不可因一时的懈怠或冲动，毁掉长期积累的心血。", true, "", "文化"],
            // ===== 为学 =====
            ["为学", "为", "实词", "wéi", "动词，做、从事", "1. 做，行，做事：～人。～时。～难。不～己甚（不做得太过分）。\n　2. 当做，认做：以～。认～。习以～常。\n　3. 变成：成～。\n　4. 是：十两～一斤。", "", "为之，则难者亦易矣", "多音多义", "", "为（wéi /wèi）\n\nwéi（阳平）：动词，表 “做、是、成为” 等实义，上古常用。\nwèi（去声）：介词，表 “替、为了、因为”，由 wéi 变调分化而来。", false, "稳定", "多音多义"],
            ["为学", "学", "实词", "xué", "学问、学业", "名词，学问、知识", "学问、学业、学识、治学", "人之为学有难易乎？", "", "“学” 表示学问的名词含义从古到今都没变，现代汉语里依然非常常用。", "", false, "稳定", ""],
            ["为学", "天下", "实词", "tiān xià", "指世界上、天底下", "名词，全世界、全社会", "天下、普天之下、天下大事", "天下事有难易乎？", "", "“天下” 表示整个世界、全社会的含义一直保留到现在，现代汉语里依然常用，多用于书面、正式表达。", "", false, "稳定", ""],
            ["为学", "鄙", "实词", "bǐ", "名词，边境、边远的地方", "1.郊野之处，边远的地方：边～。\n2.轻蔑，看不起：～视。～夷。～弃。～薄。", "", "蜀之鄙有二僧", "语义转移", "课文中 “鄙” 是名词 “边远的地方”。该义仅存于 “边鄙” 等极少数书面词中。现代 “鄙” 常用义是 “鄙视 / 鄙陋”，词义已转移。", "", false, "受限", "语义转移"],
            ["为学", "僧", "实词", "sēng", "和尚，出家修行的佛教徒", "名词，和尚、佛教出家修行者", "僧人、僧侣、高僧、老僧", "蜀之鄙有二僧", "", "", "", false, "稳定", ""],
            ["为学", "贫", "实词", "pín", "穷、贫穷，没有钱", "形容词，穷困、不富裕", "贫穷、贫困、贫寒、贫富差距", "其一贫，其一富", "", "“贫” 表示穷的核心含义从古到今都没变，现代汉语里依然常用，多用于书面、正式语境，口语更常用 “穷”。", "", false, "稳定", ""],
            ["为学", "富", "实词", "fù", "财产多、很有钱", "形容词，富裕、财物多", "富裕、富有、财富、贫富差距", "其一贫，其一富", "", "“富” 表示有钱的核心含义一直保留到现在，现代汉语里依然非常常用，还延伸出了 “丰富、充足” 等义项。", "", false, "稳定", ""],
            ["为学", "告", "实词", "gào", "动词，告诉、告知", "告-01 核心义项古今一致，口语中仍常用", "告诉、告知、报告", "以告富者", "", "核心义项古今完全一致，无明显变化", "", false, "稳定", ""],
            ["为学", "语", "实词", "yù", "动词，告诉、对……说", "现代汉语常用读音“yǔ”：\n1.话：～言。汉～。英～。～录。～汇。～重心长。\n2.代替语言的动作：手～。旗～。\n3.说：细～。低～。", "语重心长、自言自语", "贫者语于富者曰", "语义转移；多音多义", "课文中 “语（yù）” 是动词 “告诉”。该义仅在古文语境中出现。现代 “语”常读作“yǔ”， 常用义是名词 “语言 / 话语”（如 “语文”“成语”），词义中心已转移。", "语\n1. yǔ（三声）：话语、说话。例：语言、语气。\n2. yù（四声）：告诉。例：不以语人。\n速记：泛指话语读 yǔ，专指告诉读 yù。", false, "受限", "语义转移；多音多义"],
            ["为学", "恃", "实词", "shì", "动词，依靠、凭借", "依赖，仗着：仗～。有～无恐。～才傲物。", "", "子何恃而往", "", "“恃” 的 “依靠” 义地位没有变化，仍是它自己的核心常用意义。但“恃”较为正式，现代口语基本不用，主要保留在 “有恃无恐”“恃才傲物” 等成语中。口语常用 “靠 / 依靠”。", "", false, "稳定", ""],

            ["为学", "钵", "实词", "bō", "和尚用来盛饭、喝水的碗", "名词，僧人用的食器", "钵盂、饭钵、衣钵相传", "吾一瓶一钵足矣", "", "古代专指和尚的食具，现在这个用法只在佛教相关的语境里使用，日常不会用这个字，属于宗教专有名词。", "", false, "稳定", ""],

            ["为学", "舟", "实词", "zhōu", "船", "名词，船只", "小舟、龙舟、泛舟、舟车劳顿", "吾数年来欲买舟而下", "", "“舟” 表示船的含义一直保留着，但现代汉语口语里更常用 “船”，“舟” 大多留在成语、书面语和合成词里。", "", false, "频率下降", ""],
            ["为学", "下", "实词", "xià", "方位名词作动词，向下，去，到。通常指由西往东，由北往南，由上游往下游。", "动词，去往、往下走", "南下、顺流而下、下江南", "吾数年来欲买舟而下", "词类活用", "", "", false, "稳定", "词类活用"],
            ["为学", "越明年", "实词", "yuè", "“越”指及、到。明年指第二年 “越明年”，文言时间介词高频用法，在这里指到了第二年。", "1. 度过，超出：～过。～冬。～级。～轨。～权。～境。～位。～狱。～俎代庖。\n2. 表示程度加深：～发（更加）。～加。～快～好。", "", "越明年，贫者自南海还", "语义转移", "“越”在这里指及、到，是古汉语特有时间介词用法，现代汉语这个意义基本消失。“越”本义为“度过，越过，逾越”，在现代还在使用。由跨越空间的动作，引申为抵达时间节点，语义转移。", "", false, "受限", "语义转移"],

            ["为学", "还", "实词", "huán", "动词，返回、回来", "1.回到原处或恢复原状：～乡。～俗。衣锦～乡。返老～童。\n2.回报别人对自己的行动。～手。～击。以眼～眼。以牙～牙。\n3.偿付：归～。偿～。～本。原物奉～。", "", "贫者自南海还", "多音多义", "“还” 的 “返回” 义仍常用，如 “还乡”“归还”“偿还”。", "还\n\n1. hái（二声）：仍旧、还有。例：还好、还有。\n2.huán（二声）：归还、返回。例：还钱、还乡。\n速记：表仍旧读 hái，表归还读 huán。", false, "稳定", "多音多义"],

            ["为学", "南海", "文化", "Nán hǎi", "地名，指浙江舟山普陀山，中国佛教四大圣地之一。南海普陀、南海观音。", "", "", "吾欲之南海", "文化", "", "课文里的 “南海” 不是指南方的大海，是专指普陀山，这个特定指代只在佛教、语境里使用，日常说南海多指海域。普陀山是观音菩萨道场，古代僧人常前往朝拜，故称 “南海”。", true, "", "文化"],
            ["为学", "为学（彭端淑）", "文化", "", "彭端淑（约1699-1779），清代文学家。字乐斋，四川人。雍正年间进士，曾任吏部郎中、顺天乡试同考官等职。辞官后回到四川，在锦江书院讲学。著有《白鹤堂集》。", "", "", "（全文出处）", "文化", "", "彭端淑（约1699-1779），清代文学家。字乐斋，四川人。雍正年间进士，曾任吏部郎中、顺天乡试同考官等职。辞官后回到四川，在锦江书院讲学。著有《白鹤堂集》。", true, "", "文化"],
            ["为学", "文章主题", "文化", "", "《为学》，原题目是《为学一首示子侄》。这篇议论性文章是长辈对晚辈的指教与劝导。\n以事喻理，通过穷和尚与富和尚前往南海的故事，阐明有志者事竟成，学业、理想能否达成，不在于天资与物质条件，而在于是否拥有坚定志向与踏实行动", "", "", "（全文）", "文化", "", "《为学》，原题目是《为学一首示子侄》。这篇议论性文章是长辈对晚辈的指教与劝导。\n以事喻理，通过穷和尚与富和尚前往南海的故事，阐明有志者事竟成，学业、理想能否达成，不在于天资与物质条件，而在于是否拥有坚定志向与踏实行动", true, "", "文化"],

            ["爱莲说", "清", "实词", "qīng", "清澈的、洁净的", "形容词，干净透明；也指气味清淡", "清澈、清水、清洁", "濯清涟而不妖", "语义扩大", "本义为 “水干净”，现代汉语延伸出 “清楚、清淡、清廉” 等大量义项，词义范围大幅扩大，为核心稳定字。", "", false, "稳定", "语义扩大"],

            ["爱莲说", "涟", "实词", "lián", "水的波纹、涟漪", "名词，水面细小的波纹", "涟漪、涟波、清涟", "濯清涟而不妖", "", "文言稳定写景名词，现代汉语仅留存于 “涟漪” 等合成词中，日常口语用 “波纹、水纹” 替代。", "", false, "频率下降", ""],
            ["爱莲说", "妖", "实词", "yāo", "形容词，艳丽而不端庄、妖艳", "1.迷信的人指异于常态而害人的东西：～魔鬼怪。～精（a.妖怪；b.喻姿色迷人的女子。“精”均读轻声）。\n2.装束或神态不正派：～里～气。～态。\n3.媚，艳丽：～女。～娆。～艳。～冶。～妍。", "", "濯清涟而不妖", "语义转移", "文中形容莲花不显得妖艳。本义是“姿容艳丽”，现代多含贬义，形容人 / 事物过分艳丽、不正派，也与 “精 / 怪” 连用指妖怪，语义转移。", "文中指莲花 “不妖艳、不媚俗”；现代多形容人，贬义更强", false, "稳定", "语义转移"],

            ["爱莲说", "植", "实词", "zhí", "动词，竖立", "1.栽种：种～。培～。栽～。～树。\n2.树立：～立。～志（立志）。\n3.戮住，竖起：～耳。\n生物的一大类，谷类、花草、树木等的统称：～物。～被。～保。", "", "亭亭净植", "语义转移", "古义为动作义，现代主要作名词指草木，动词用法仅留存于书面语。", "", false, "受限", "语义转移"],

            ["爱莲说", "观", "实词", "guān", "观赏、欣赏", "动词，细看、欣赏；也作名词", "观赏、参观、景观、走马观花", "可远观而不可亵玩焉", "多音多义", "", "观\n\n1. guān（一声）：看、景象、看法。例：观看、景观、观点。\n2. guàn（四声）：高大建筑、庙宇。例：道观、楼观。\n速记：表动作 / 景象读 guān，表建筑读 guàn。", false, "稳定", "多音多义"],

            ["爱莲说", "隐逸", "实词", "yǐn yì", "避世隐居，也指隐居的人", "动词 / 名词，隐居避世；隐士", "隐逸山林、隐逸之士", "花之隐逸者也", "", "古代士大夫文化专属词汇，现代汉语仅用于历史、文学书面语境，口语多用 “隐居、避世” 替代。", "与 “出仕” 相对，是古代士人的两种人生选择。", false, "频率下降", ""],
            ["爱莲说", "君子", "实词", "jūn zǐ", "品德高尚、有操守的人", "名词，人格端正的人", "正人君子、君子之交、谦谦君子", "花之君子者也", "", "儒家核心人格概念，核心含义古今完全一致，现代汉语仍为稳定文化词汇，多用于正式、书面表达。", "", false, "稳定", ""],
            ["爱莲说", "鲜", "实词", "xiǎn", "形容词，稀少、很少", "数量少", "鲜为人知", "陶后鲜有闻", "多音多义", "该读音表 “稀少” 的义项，仍是自己的稳定义项c当前稳定于成语、固定词语等。“～为人知”", "鲜\n\n1. xiān（一声）：新鲜、鲜美。例：鲜花、鲜美。\n2. xiǎn（三声）：少。例：鲜为人知。\n速记：表新鲜读 xiān，表稀少读 xiǎn。", false, "稳定", "多音多义"],

            ["爱莲说", "独", "虚词", "dú", "唯独、只、单单", "1.单一，只有一个：～唱。～立。～裁。～创。～特。\n2.老而无子：寡孤～。", "", "晋陶渊明独爱菊", "", "古义唯独、只的意思使用频率略有下降。现代常用义为“单一，只有一个”", "", false, "频率下降", ""],
            ["爱莲说", "益", "虚词", "yì", "更加、越发", "程度副词，表递进加深", "日益、精益求精、多多益善", "香远益清", "", "文言表递进的程度副词，现代汉语该用法仅留存于成语、书面语中，日常口语多用 “更、更加” 替代。", "", false, "频率下降", ""],
            ["爱莲说", "宜", "虚词", "yí", "副词，应当", "1.适合，适当：～人。～于。合～。权～。适～。相～。\n2.应该，应当：事不～迟。", "", "宜乎众矣", "", "古义多作副词表理应如此，现代以形容词用法为主", "", false, "频率下降", ""],
            ["爱莲说", "乎", "虚词", "hū", "用在形容词、副词后，表情态、赞美、叹息语气，可译为“啊”“呀”，也可不译", "啊、呀（语气助词）", "", "牡丹之爱，宜乎众矣！", "", "文言特色语气用法，现代汉语不再单用该字承接语气，改用语气词替代", "", false, "受限", ""],

            ["爱莲说", "而", "虚词", "ér", "转折连词，却、但是", "转折连词，却、但是", "反而、然而、似是～非", "出淤泥而不染 / 濯清涟而不妖 / 可远观而不可亵玩焉", "", "三处用法完全一致，均表转折；文言单用 “而” 表转折，现代通用语体不单独使用，主要在一些词语中稳定。", "", false, "频率下降", ""],

            ["爱莲说", "之", "虚词", "zhī", "主谓之间助词，无实义，取消句子独立性.", "现代汉语中该用法主要在仿古书面语中偶见残余，例词：生命之脆弱令人叹息、时光之流逝不可阻挡。", "", "予独爱莲之出淤泥而不染", "", "古代\"之\"插入主谓间使结构名词化，现代汉语相应功能由\"的\"字结构替代，之的使用频率下降。", "", false, "频率下降", ""],
            ["爱莲说", "之", "虚词", "zhī", "结构助词，宾语前置标志，无实义；正常语序：爱牡丹", "现代汉语无前置标志，语序为 “喜爱牡丹”", "古：菊之爱 ← 今：喜爱菊花", "牡丹之爱，宜乎众矣", "倒装句", "古汉语用 “之” 将宾语提前，形成倒装结构；现代汉语使用正常动宾语序，无此类语法", "", false, "受限", "倒装句"],

            ["爱莲说", "自…… 来", "固定格式", "zì……lái", "从…… 以来，表时间起点的固定结构", "固定时间结构，引出时间开端", "自古以来。自…… 来", "自李唐来，世人甚爱牡丹", "固定格式", "现代汉语书面、口语依旧使用。", "", false, "稳定", "固定格式"],
            ["爱莲说", "……者", "固定格式", "zhě", "\"者\" 附在名词 / 动词后，指代 \"…… 的人 / 事物\"", "现代汉语多用 “…… 的”，极少单用 “者”", "读者、作者", "可爱者甚蕃 / 花之隐逸者也 / 花之富贵者也 / 花之君子者也 / 同予者何人", "固定格式", "“者” 指代 “…… 的人 / 事物”，现代多用 “…… 的”，极少单用 “者”。", "", false, "频率下降", "固定格式"],
            ["爱莲说", "宾语前置", "句式", "zhī", "“之”结构助词，宾语前置标志，无实义；正常语序：爱牡丹", "现代汉语无前置标志，语序为 “喜爱牡丹”", "古：菊之爱 ← 今：喜爱菊花", "牡丹之爱，宜乎众矣", "倒装句", "古汉语用 “之” 将宾语提前，形成倒装结构；现代汉语使用正常动宾语序，无此类语法", "", false, "受限", "倒装句"],
            ["爱莲说", "\"说\"（古代文体）", "文化", "/", "古代文体，可叙事、说明、发表议论，如《马说》《捕蛇者说》。现代归入议论文、杂文范畴，无专用对应文体。", "", "", "篇目《爱莲说》", "文化", "", "古代文体，可叙事、说明、发表议论，如《马说》《捕蛇者说》。现代归入议论文、杂文范畴，无专用对应文体。", true, "", "文化"],
            ["爱莲说", "晋", "文化", "Jìn", "古代朝代名称，晋朝，这里指东晋", "", "", "晋陶渊明独爱菊", "文化", "", "分为西晋、东晋，东晋时期隐逸文化盛行。", true, "", "文化"],
            ["爱莲说", "陶渊明", "文化", "Táo Yuān míng", "人名，东晋著名田园诗人，世称靖节先生", "", "", "晋陶渊明独爱菊", "文化", "", "田园诗派创始人，号五柳先生，爱菊、隐居，是隐逸文化代表人物。", true, "", "文化"],
            ["爱莲说", "李唐", "文化", "Lǐ Táng", "唐朝的别称，因皇室姓李故称", "", "", "自李唐来", "文化", "", "古代常以皇室姓氏代称朝代，是常见文化现象。", true, "", "文化"],
            ["爱莲说", "周敦颐", "文化", "zhōu dūn yí", "", "", "", "（全文作者）", "文化", "", "周敦颐（1017-1073），又名周元皓，字茂叔，原名周敦实，号濂溪，世称濂溪先生，谥号“元公”。道州营道(今湖南道县)人。 是宋朝儒家理学思想的开山鼻祖，文学家、哲学家。著有《周元公集》。", true, "", "文化"],
            ["爱莲说", "莲（别称与象征）", "文化", "lián", "", "", "", "（全文）", "文化", "", "莲是荷花的别称，文中象征君子高洁的品格。莲花、莲荷，常喻指品行高尚之人、象征含义沿用至今，为经典文学意象", true, "", "文化"],
            ["爱莲说", "文章主题与写作手法", "文化", "/", "", "", "", "（全文）", "文化", "", "托物言志就是借助某一种事物的外形、品性来寄托自己的理想、品格与追求，《爱莲说》中周敦颐借莲花出淤泥却洁净正直的特点，抒发自己不慕名利、洁身自好的志趣；如今写作也可以借用各类事物表达内心志向，比如梅花象征不畏艰难、竹子代表正直谦逊、松柏寓意坚韧不屈、兰花代表淡泊高雅、小草象征顽强不屈，路灯、蜡烛则用来赞美无私奉献的品格。", true, "", "文化"],
            // ===== 马说 =====
            ["马说", "辱", "实词", "rǔ", "形容词作动词，受屈辱", "1. 羞耻：羞～。耻～。\n　2. 使受到羞耻：～骂。侮～。折～。", "", "祗辱于奴隶人之手", "词类活用·形作动", "文中活用为动词，日常以名词/动词为主", "", false, "", "词类活用·形作动"],
            ["马说", "奴隶", "实词", "nú lì", "名词，奴仆", "奴隶-01 名词，为奴隶主劳动而没有人身自由的人", "奴隶社会、奴隶制度", "祗辱于奴隶人之手", "", "古今“奴隶”的核心义项没有改变，仍指没有人身自由、被他人役使的人，。只是如今现实中已基本不存在传统意义上的奴隶，这个词现在更多用于指代奴隶制度、奴隶社会这类书面/文言场景，日常口语里很少使用。", "", false, "频率下降", ""],
            ["马说", "骈", "实词", "pián", "两马并驾，引申为并列", "动词 / 形容词，并列、并排", "骈文、骈俪、骈列、骈体", "骈死于槽枥之间", "", "古代 “骈” 本义是两马并驾，引申为并列，现在这个本义基本不用，只频率下降在 “骈文” 等少数书面词汇里。", "", false, "受限", ""],
            ["马说", "骈死", "实词", "pián sǐ", "并列而死，和普通马一同死去", "动词短语，一同死去、并排而死", "骈死槽枥", "骈死于槽枥之间", "", "", "", false, "受限", ""],
            ["马说", "槽枥", "实词", "cáo lì", "喂马的食槽和马棚，代指马厩", "名词，养马的器具和棚舍", "马槽、枥棚", "骈死于槽枥之间", "", "古代养马专用名词，现代汉语基本不用，日常都说 “马槽、马棚”，“枥” 仅在文言成语中留存。", "", false, "受限", ""],

        function normalizeBaseLabel(label, cat) {
            let b = getBaseLabel(label);
            if (b === '……者' || b === '…… 者' || b === '……者（指代结构）' || b === '……者 指代结构') return '……者';
            if (b === '……者……也 判断句式') return '……者……也';
            if (b === '虽……必…… 固定句式' || b === '虽……必…… 让步推断句式') return '虽……必……';
            if (label.includes('托物言志') || label.includes('文章主题与写作手法')) return '托物言志';
            if (b === '状语后置句' || b === '倒装句，状语后置' || b === '倒装句') return '倒装句';
            if (b === '省略句，省略主语' || b === '省略句，省略宾语' || b.startsWith('省略句')) return '省略句';
            return b;
        }

        function addEntry(lesson, label, category, pinyin, wenZhongYi, xianDaiDuiYing, example, sentence, relation,
            yanBianShuoMing, note, isCulture, status, relationFull) {
            const baseLabel = normalizeBaseLabel(label, category);
            const key = lesson + '|' + baseLabel + '|' + category;
            if (!entryMap[key]) {
                entryMap[key] = {
                    lesson: lesson,
                    label: baseLabel,
                    baseLabel: baseLabel,
                    category: category,
                    pinyin: pinyin || '',
                    isCulture: isCulture || false,
                    cultureNote: '',
                    status: status || '',
                    relationFull: relationFull || '',
                    entries: []
                };
            }
            if (isCulture) {
                entryMap[key].cultureNote = note || yanBianShuoMing || '';
            } else {
                entryMap[key].entries.push({
                    entryLabel: label,
                    wenZhongYi: wenZhongYi || '',
                    xianDaiDuiYing: xianDaiDuiYing || '',
                    example: example || '',
                    sentence: sentence || '',
                    relation: relation || '',
                    yanBianShuoMing: yanBianShuoMing || '',
                    note: note || '',
                    status: status || '',
                    relationFull: relationFull || ''
                });
            }
        }

        allData.forEach(item => {
            const [lesson, label, category, pinyin, wenZhongYi, xianDaiDuiYing, example, sentence, relation, yanBianShuoMing,
                note, isCulture, status, relationFull
            ] = item;
            addEntry(lesson, label, category, pinyin, wenZhongYi, xianDaiDuiYing, example, sentence, relation,
                yanBianShuoMing, note, isCulture, status, relationFull);
        });

        // ============================================================
        // 3. 构建节点和边
        // ============================================================
        const rawNodes = [];
        const nodeIdMap = {};

        Object.keys(entryMap).forEach(key => {
            const obj = entryMap[key];
            const id = 'n_' + obj.lesson + '_' + obj.label + '_' + obj.category;
            if (nodeIdMap[id]) {
                nodeIdMap[id].entries = nodeIdMap[id].entries.concat(obj.entries);
                return;
            }
            const node = {
                id: id,
                label: obj.label,
                baseLabel: obj.baseLabel || obj.label,
                category: obj.category,
                lesson: obj.lesson,
                text: obj.lesson,
                pinyin: obj.pinyin || '',
                isCulture: obj.isCulture || false,
                cultureNote: obj.cultureNote || '',
                status: obj.status || '',
                relationFull: obj.relationFull || '',
                entries: obj.entries || [],
                isTextCenter: false,
                isBlock: false
            };
            rawNodes.push(node);
            nodeIdMap[id] = node;
        });

        const allLessonNames = ['精卫填海', '夸父逐日', '自相矛盾', '画蛇添足', '执长竿入城', '火烧裳尾', '远水不救近火', '拔杨容易栽杨难', '为学', '爱莲说',
            '马说'
        ];
        const allCategories = ['实词', '虚词', '固定格式', '句式', '文化'];

        // 课文中心
        const textCenterNodes = allLessonNames.map(ls => ({
            id: 'n_' + ls,
            label: '📄 ' + ls,
            category: '课文中心',
            lesson: ls,
            text: ls,
            isTextCenter: true,
            isBlock: false,
            entries: [],
            cultureNote: ''
        }));
        rawNodes.push(...textCenterNodes);

        // 板块
        const blockNodes = [];
        allLessonNames.forEach(ls => {
            allCategories.forEach(cat => {
                const id = 'n_' + cat + '_' + ls;
                blockNodes.push({
                    id: id,
                    label: '📂 ' + cat,
                    category: '板块',
                    lesson: ls,
                    text: ls,
                    isTextCenter: false,
                    isBlock: true,
                    entries: [],
                    cultureNote: ''
                });
            });
        });
        rawNodes.push(...blockNodes);

        // 边
        const rawEdges = [];

        function addEdge(s, t) { rawEdges.push({ source: s, target: t }); }

        function getBlockId(lesson, category) {
            const map = {};
            allLessonNames.forEach(ls => {
                map[ls] = {};
                allCategories.forEach(cat => {
                    map[ls][cat] = 'n_' + cat + '_' + ls;
                });
            });
            return map[lesson]?.[category] || '';
        }

        function getTextCenterId(lesson) {
            const map = {};
            textCenterNodes.forEach(n => { map[n.text] = n.id; });
            return map[lesson] || '';
        }

        rawNodes.forEach(node => {
            if (node.isTextCenter) return;
            if (node.isBlock) {
                const centerId = getTextCenterId(node.text);
                if (centerId) addEdge(centerId, node.id);
                return;
            }
            const blockId = getBlockId(node.text, node.category);
            if (blockId) addEdge(blockId, node.id);
        });

        // 跨课关联
        const labelMap = {};
        rawNodes.forEach(n => {
            if (n.isTextCenter || n.isBlock) return;
            const key = n.baseLabel || n.label;
            if (!labelMap[key]) labelMap[key] = [];
            labelMap[key].push(n.id);
        });
        const crossPairs = new Set();
        Object.keys(labelMap).forEach(baseLabel => {
            const ids = labelMap[baseLabel];
            if (ids.length < 2) return;
            const lessonsSet = new Set();
            ids.forEach(id => {
                const node = rawNodes.find(n => n.id === id);
                if (node) lessonsSet.add(node.text);
            });
            if (lessonsSet.size < 2) return;
            for (let i = 0; i < ids.length; i++) {
                for (let j = i + 1; j < ids.length; j++) {
                    const ni = rawNodes.find(n => n.id === ids[i]);
                    const nj = rawNodes.find(n => n.id === ids[j]);
                    if (!ni || !nj) continue;
                    if (ni.text === nj.text) continue;
                    const key = [ids[i], ids[j]].sort().join('|');
                    if (!crossPairs.has(key)) {
                        crossPairs.add(key);
                        rawEdges.push({ source: ids[i], target: ids[j], isCross: true, crossLabel: baseLabel });
                    }
                }
            }
        });

        // ============================================================
        // 4. ECharts 渲染
        // ============================================================
        const catMap = {
            '课文中心': 0,
            '板块': 1,
            '实词': 2,
            '虚词': 3,
            '固定格式': 4,
            '句式': 5,
            '文化': 6
        };
        const categories = [
            { name: '课文中心', itemStyle: { color: '#1e293b' } },
            { name: '板块', itemStyle: { color: '#64748b' } },
            { name: '实词', itemStyle: { color: '#3b82f6' } },
            { name: '虚词', itemStyle: { color: '#f59e0b' } },
            { name: '固定格式', itemStyle: { color: '#8b5cf6' } },
            { name: '句式', itemStyle: { color: '#10b981' } },
            { name: '文化', itemStyle: { color: '#ef4444' } }
        ];

        const nodes = rawNodes.map(n => {
            let size = 28;
            if (n.isTextCenter) size = 44;
            else if (n.isBlock) size = 18;
            let color = '#94a3b8';
            if (n.category === '实词') color = '#3b82f6';
            else if (n.category === '虚词') color = '#f59e0b';
            else if (n.category === '固定格式') color = '#8b5cf6';
            else if (n.category === '句式') color = '#10b981';
            else if (n.category === '文化') color = '#ef4444';
            else if (n.category === '课文中心') color = '#1e293b';
            else if (n.category === '板块') color = '#64748b';
            return {
                id: n.id,
                name: n.label,
                category: catMap[n.category] !== undefined ? catMap[n.category] : 0,
                symbolSize: size,
                itemStyle: { color },
                raw: n,
                _relation: '',
                _isCrossNode: false
            };
        });

        const edges = rawEdges.map(e => ({
            source: e.source,
            target: e.target,
            lineStyle: {
                color: e.isCross ? '#ef4444' : '#94a3b8',
                width: e.isCross ? 2.5 : 1.0,
                curveness: e.isCross ? 0.3 : 0.1
            },
            isCross: e.isCross || false,
            crossLabel: e.crossLabel || '',
            silent: !e.isCross,
            emphasis: { disabled: true }
        }));

        const chartDom = document.getElementById('chart');
        const myChart = echarts.init(chartDom);

        let currentFilters = new Set(['all']);
        let currentHighlights = new Set();
        const lessonOrderArr = allLessonNames;


        // 将多组筛选统一按“组内或、组间且”计算。
        // 分类、文中功能现状、关联类型与跨课关联共同开启时，
        // 一个知识节点必须同时满足所有已开启的筛选条件才会显示。
        function expandSelectedRelationFilters(highlights) {
            const relationGroups = {
                '语义层': ['语义扩大', '语义缩小', '语义转移'],
                '词类活用': ['词类活用·名作动', '词类活用·形作动', '词类活用·使动', '词类活用·名作状'],
                '句式': ['省略句', '判断句', '让步句式', '被动句', '倒装句']
            };
            const expanded = [];
            [...highlights].filter(h => h.startsWith('rel-')).forEach(function(h) {
                const name = h.replace('rel-', '').replace(/・/g, '·');
                const values = relationGroups[name] || [name];
                values.forEach(function(value) {
                    if (!expanded.includes(value)) expanded.push(value);
                });
            });
            return expanded;
        }

        function knowledgeNodeMatchesHighlights(nodeData, highlights) {
            const raw = nodeData && nodeData.raw;
            if (!raw || raw.isTextCenter || raw.isBlock) return false;

            const activeCats = [...highlights]
                .filter(h => h.startsWith('cat-'))
                .map(h => h.replace('cat-', ''));
            const activeStatuses = [...highlights]
                .filter(h => h.startsWith('status-'))
                .map(h => h.replace('status-', ''));
            const activeRelations = expandSelectedRelationFilters(highlights);
            const hasCross = highlights.has('cross');

            if (activeCats.length > 0 && !activeCats.includes(raw.category || '')) return false;

            if (activeStatuses.length > 0) {
                const statuses = getNodeStatuses(raw);
                if (!activeStatuses.some(status => statuses.includes(status))) return false;
            }

            if (activeRelations.length > 0) {
                const relations = getNodeRelations(raw);
                if (!activeRelations.some(target => relationMatches(relations, target))) return false;
            }

            if (hasCross && !isCrossKnowledgeNode(raw)) return false;
            return true;
        }

        // 核心渲染函数
        function buildOption(nodesData, edgesData, highlights) {
            const isHighlightActive = highlights.size > 0;
            const processedNodes = nodesData.map(n => {
                let itemStyle = { ...n.itemStyle };
                let labelStyle = { ...n.label };
                let symbolSize = n.symbolSize;
                const isMatch = Boolean(n._isFilterMatch);
                if (isHighlightActive) {
                    if (isMatch) {
                        itemStyle = { ...itemStyle, borderColor: '#ef4444', borderWidth: 3, shadowBlur: 12,
                            shadowColor: 'rgba(239,68,68,0.4)' };
                        labelStyle = { ...labelStyle, fontWeight: 700, color: '#b91c1c', opacity: 1 };
                        symbolSize = (symbolSize || 28) * 1.3;
                    } else {
                        itemStyle = { ...itemStyle, opacity: 0.12 };
                        labelStyle = { ...labelStyle, opacity: 0.12 };
                    }
                }
                n._isHighlightMatch = isMatch;
                return { ...n, itemStyle, label: labelStyle, symbolSize };
            });
            const processedEdges = edgesData.map(e => {
                let lineStyle = { ...e.lineStyle };
                if (isHighlightActive) {
                    // renderGraph 已经移除了不符合条件的节点和连线；这里只设置保留下来的线条样式。
                    if (e.isCross) {
                        lineStyle = { ...lineStyle, width: 4, opacity: 1, color: '#ef4444' };
                    } else {
                        // 筛选状态下隐藏普通层级连线，只保留符合条件的跨课关联红线，
                        // 避免课文中心、板块与知识节点之间的灰蓝色背景线干扰观察。
                        lineStyle = { ...lineStyle, width: 0, opacity: 0 };
                    }
                }
                return { ...e, lineStyle };
            });
            return {
                tooltip: {
                    trigger: 'item',
                    triggerOn: 'mousemove',
                    showDelay: 600,
                    hideDelay: 50,
                    enterable: false,
                    alwaysShowContent: false,
                    formatter: function(params) {
                        if (params.dataType === 'edge') return '';
                        if (params.dataType === 'node') {
                            const d = params.data;
                            if (currentHighlights.size > 0 && d.raw && !d.raw.isTextCenter && !d.raw.isBlock) {
                                const processedNode = nodes.find(n => n.id === d.id);
                                if (processedNode && !processedNode._isHighlightMatch) return '';
                            }
                            if (d.raw && d.raw.isTextCenter) return `<strong>📄 ${d.name}</strong><br/>课文中心`;
                            if (d.raw && d.raw.isBlock) return '';
                            if (d.raw) {
                                let html = `<strong>${d.name}</strong>`;
                                if (d.raw.pinyin) html += `<br/>拼音：${d.raw.pinyin}`;
                                if (d.raw.category) html += `<br/>分类：${d.raw.category}`;
                                if (d.raw.text) html += `<br/>课文：${d.raw.text}`;
                                if (d.raw.entries && d.raw.entries.length > 0) {
                                    const firstSentence = d.raw.entries.map(e => e.sentence).filter(s => s && s.trim())[0];
                                    if (firstSentence) {
                                        const shortSentence = firstSentence.length > 30 ? firstSentence.slice(0, 30) +
                                        '…' : firstSentence;
                                        html += `<br/><span style="color:#94a3b8;font-size:11px;">「${shortSentence}」</span>`;
                                    }
                                }
                                return html;
                            }
                            return d.name;
                        }
                        return '';
                    }
                },
                legend: { show: false },
                series: [{
                    type: 'graph',
                    layout: 'force',
                    force: { repulsion: 450, edgeLength: [80, 280], gravity: 0.05, friction: 0.15,
                        layoutAnimation: true },
                    data: processedNodes,
                    edges: processedEdges,
                    categories: categories,
                    roam: true,
                    draggable: true,
                    focusNodeAdjacency: false,
                    emphasis: { disabled: true },
                    edgeSymbol: ['none', 'none'],
                    label: {
                        show: true,
                        position: 'bottom',
                        fontSize: 11,
                        fontWeight: 500,
                        color: '#1e293b',
                        offset: [0, 4],
                        formatter: function(params) {
                            if (params.data && params.data.raw && params.data.raw.isTextCenter) {
                                return '{bold|' + params.name + '}';
                            }
                            return params.name;
                        },
                        rich: { bold: { fontSize: 14, fontWeight: 700, color: '#1e293b' } }
                    },
                    lineStyle: { color: 'source', curveness: 0.1, width: 1.0, opacity: 0.5 },
                    itemStyle: { borderColor: '#ffffff', borderWidth: 2, shadowBlur: 4,
                        shadowColor: 'rgba(0,0,0,0.05)' },
                    symbolSize: function(value, params) {
                        if (params.data && params.data.raw && params.data.raw.isTextCenter) return 44;
                        if (params.data && params.data.raw && params.data.raw.isBlock) return 18;
                        return params.data.symbolSize || 28;
                    },
                    zoom: 0.6,
                    roam: true
                }]
            };
        }

        function renderGraph() {
            // 先应用篇目范围；篇目筛选之外的节点不参与组合筛选。
            const lessonScopedNodes = (!currentFilters.has('all') && currentFilters.size > 0)
                ? nodes.filter(n => n.raw && currentFilters.has(n.raw.text))
                : nodes.slice();
            const lessonScopedIds = new Set(lessonScopedNodes.map(n => n.id));
            const hasKnowledgeFilter = currentHighlights.size > 0;

            // 每次重绘先清空旧状态，防止上一次筛选残留。
            nodes.forEach(function(n) {
                n._isFilterMatch = false;
                n._isHighlightMatch = false;
            });

            let filteredNodes = lessonScopedNodes;
            let filteredEdges;

            if (!hasKnowledgeFilter) {
                // 未开启高亮筛选时，保持原有完整图谱。
                filteredEdges = edges.filter(e => lessonScopedIds.has(e.source) && lessonScopedIds.has(e.target));
            } else {
                // 知识节点必须同时满足所有已开启的筛选组。
                const matchedKnowledgeNodes = lessonScopedNodes.filter(function(n) {
                    const matched = knowledgeNodeMatchesHighlights(n, currentHighlights);
                    n._isFilterMatch = matched;
                    n._isHighlightMatch = matched;
                    return matched;
                });

                // 只补回匹配节点所属的板块节点和篇目中心，方便看清层级关系；
                // 其他未匹配的知识节点不会显示。
                const visibleIds = new Set();
                matchedKnowledgeNodes.forEach(function(n) {
                    visibleIds.add(n.id);
                    const raw = n.raw;
                    const blockId = getBlockId(raw.text, raw.category);
                    const centerId = getTextCenterId(raw.text);
                    if (blockId && lessonScopedIds.has(blockId)) visibleIds.add(blockId);
                    if (centerId && lessonScopedIds.has(centerId)) visibleIds.add(centerId);
                });

                filteredNodes = lessonScopedNodes.filter(n => visibleIds.has(n.id));

                // 线条必须两端都仍然可见：
                // 1) 普通层级线只连接保留下来的中心、板块和匹配节点；
                // 2) 跨课线只有在开启“跨课关联”且两端节点都通过全部组合筛选时才显示。
                filteredEdges = edges.filter(function(e) {
                    if (!visibleIds.has(e.source) || !visibleIds.has(e.target)) return false;
                    if (!e.isCross) return true;
                    if (!currentHighlights.has('cross')) return false;
                    const sourceNode = nodes.find(n => n.id === e.source);
                    const targetNode = nodes.find(n => n.id === e.target);
                    return Boolean(sourceNode && targetNode && sourceNode._isFilterMatch && targetNode._isFilterMatch);
                });
            }

            // 只给当前篇目范围内真正具有跨课同形关系的知识节点打标记。
            filteredNodes.forEach(function(n) {
                n._isCrossNode = Boolean(
                    n.raw && !n.raw.isTextCenter && !n.raw.isBlock && isCrossKnowledgeNode(n.raw)
                );
            });

            const option = buildOption(filteredNodes, filteredEdges, currentHighlights);
            myChart.setOption(option, true);
            myChart.resize();
        }

        renderGraph();

        // ============================================================
        // 5. 交互功能
        // ============================================================
        function toggleCatMenu() {
            document.getElementById('catMenu').classList.toggle('open');
            document.getElementById('statusMenu')?.classList.remove('open');
            document.getElementById('relMenu')?.classList.remove('open');
        }

        function toggleCatSubById(subId, toggleEl) {
            const sub = document.getElementById(subId);
            if (sub) sub.classList.toggle('open');
            if (toggleEl) toggleEl.classList.toggle('open');
        }

        function toggleCatHlDirect(btn) {
            const hl = btn.dataset.hl;
            btn.classList.toggle('active-cat');
            if (btn.classList.contains('active-cat')) { currentHighlights.add(hl); } else { currentHighlights.delete(hl); }
            updateCatBtnLabel();
            renderGraph();
        }

        function updateCatBtnLabel() {
            const active = [...currentHighlights].filter(h => h.startsWith('cat-'));
            const el = document.getElementById('catBtnLabel');
            if (!el) return;
            if (active.length > 0) {
                el.textContent = '分类 ✓ ' + active.map(h => h.replace('cat-', '')).join('/');
                el.style.color = '#1d4ed8';
            } else { el.textContent = '分类 ▾';
                el.style.color = ''; }
        }

        function toggleStatusMenu() {
            document.getElementById('statusMenu').classList.toggle('open');
            document.getElementById('catMenu').classList.remove('open');
            document.getElementById('relMenu').classList.remove('open');
        }

        function toggleStatusHl(btn) {
            btn.classList.toggle('active-cat');
            if (btn.classList.contains('active-cat')) { currentHighlights.add(btn.dataset.hl); } else { currentHighlights
                    .delete(btn.dataset.hl); }
            updateStatusBtnLabel();
            renderGraph();
        }

        function updateStatusBtnLabel() {
            const active = [...currentHighlights].filter(h => h.startsWith('status-'));
            const el = document.getElementById('statusBtnLabel');
            if (!el) return;
            if (active.length > 0) {
                el.textContent = '现状 ✓ ' + active.map(h => h.replace('status-', '')).join('/');
                el.style.color = '#1d4ed8';
            } else { el.textContent = '文中功能现状 ▾';
                el.style.color = ''; }
        }

        function toggleRelMenu() {
            document.getElementById('relMenu').classList.toggle('open');
            document.getElementById('catMenu').classList.remove('open');
            document.getElementById('statusMenu').classList.remove('open');
        }

        const REL_GROUPS = {
            'rel-语义层': ['rel-语义扩大', 'rel-语义缩小', 'rel-语义转移'],
            'rel-词类活用': ['rel-词类活用·名作动', 'rel-词类活用·形作动', 'rel-词类活用·使动', 'rel-词类活用·名作状'],
            'rel-句式': ['rel-省略句', 'rel-判断句', 'rel-让步句式', 'rel-被动句', 'rel-倒装句'],
        };

        function toggleRelHl(btn) {
            btn.classList.toggle('active-cat');
            if (btn.classList.contains('active-cat')) { currentHighlights.add(btn.dataset.hl); } else { currentHighlights
                    .delete(btn.dataset.hl); }
            syncRelParentStates();
            updateRelBtnLabel();
            renderGraph();
        }

        function toggleRelHlGroup(btn, groupKey) {
            const children = REL_GROUPS[groupKey] || [];
            btn.classList.toggle('active-cat');
            const isActive = btn.classList.contains('active-cat');
            children.forEach(h => { if (isActive) currentHighlights.add(h);
                else currentHighlights.delete(h); });
            document.querySelectorAll('.cat-sub-btn').forEach(sb => {
                if (children.includes(sb.dataset.hl)) {
                    sb.classList.toggle('active-hl', isActive);
                    sb.classList.toggle('active-cat', isActive);
                }
            });
            updateRelBtnLabel();
            renderGraph();
        }

        function syncRelParentStates() {
            const subBtns = document.querySelectorAll('.cat-sub-btn');
            const activeSubs = new Set();
            subBtns.forEach(sb => {
                if (sb.classList.contains('active-cat') || sb.classList.contains('active-hl')) {
                    activeSubs.add(sb.dataset.hl);
                }
            });
            Object.keys(REL_GROUPS).forEach(groupKey => {
                const children = REL_GROUPS[groupKey] || [];
